<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
@font-face{font-family:'Hanken Grotesk';src:url(/home/assets/fonts/hanken.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(/home/assets/fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
:root{--bg:#F3F5F9;--card:#fff;--paper:#fff;--ink:#0B1A2E;--ink2:#2B3A50;--mute:#6E7887;--line:#E2E5EB;--soft:#F5F7FA;--blue:#1F4FE0;--blue-t:#E7EDFC;--coral:#FF5A3C;--coral-t:#FFE9E3;--good:#0E8A5F;--good-t:#E3F3EC;--warn:#B5822A;--warn-t:#F8EFDC;--bad:#D7261B;--bad-t:#FDECEA;
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060B14;--card:#0E1726;--paper:#0E1726;--ink:#EEF2F8;--ink2:#C7D0DD;--mute:#8D99AB;--line:#1F2B3D;--soft:#131E30;--blue:#6E93FF;--blue-t:#16244A;--coral:#FF7A5F;--coral-t:#3A1A14;--good:#3CC48D;--good-t:#0F2E22;--warn:#E0AE52;--warn-t:#33270F;--bad:#FF6B5E;--bad-t:#3A1513}}
:root[data-theme="dark"]{--bg:#060B14;--card:#0E1726;--paper:#0E1726;--ink:#EEF2F8;--ink2:#C7D0DD;--mute:#8D99AB;--line:#1F2B3D;--soft:#131E30;--blue:#6E93FF;--blue-t:#16244A;--coral:#FF7A5F;--coral-t:#3A1A14;--good:#3CC48D;--good-t:#0F2E22;--warn:#E0AE52;--warn-t:#33270F;--bad:#FF6B5E;--bad-t:#3A1513}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}p{margin:0;text-wrap:pretty}a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.small{font-size:13px;color:var(--mute)}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.p-good{background:var(--good-t);color:var(--good)}.p-warn{background:var(--warn-t);color:var(--warn)}.p-bad{background:var(--bad-t);color:var(--bad)}.p-blue{background:var(--blue-t);color:var(--blue)}
/* nav */
nav.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.top a{flex:none;text-decoration:none;color:var(--ink2);font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:99px}
nav.top a.on{background:var(--ink);color:var(--paper)}
nav.top .brand{font-family:var(--display);font-weight:700;color:var(--ink);margin-right:8px}
/* hero */
header.hero{background:radial-gradient(120% 120% at 90% 0%,#2a4fd6 0%,#0d1d47 45%,#060b18 100%);color:#fff;padding:64px 0 56px;position:relative;overflow:hidden}
header.hero .eyebrow{color:#ff8a70}
header.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-.03em;max-width:900px}
header.hero .lede{font-size:clamp(17px,2vw,21px);color:rgba(255,255,255,.82);max-width:760px;margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 18px}
.kpi .num{font-size:40px;line-height:1}.kpi p{font-size:13.5px;color:rgba(255,255,255,.75);margin-top:6px}
.orb{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.orb::after{content:"";position:absolute;inset:110px;border-radius:50%;border:1px solid rgba(255,138,112,.3)}
/* sections */
section.sec{padding:64px 0 8px;scroll-margin-top:60px}
.sec h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.6vw,42px);line-height:1.08;letter-spacing:-.02em;max-width:900px}
.sec h2 .g{color:var(--mute)}
.sec .sub{color:var(--ink2);font-size:17px;max-width:780px;margin-top:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
/* spotlights */
.spots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.spot{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.spot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--coral)}
.spot.champion::before{background:var(--good)}
.spot .tag{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
.spot.champion .tag{color:var(--good)}
.spot .loc{font-family:var(--display);font-size:19px;font-weight:600}
.spot .big{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.spot p{font-size:14.5px;color:var(--ink2)}
.spot a.go{font-size:13px;font-weight:700;text-decoration:none;margin-top:auto}
/* quadrant */
.quad{position:relative}
.quad svg{width:100%;height:auto;display:block}
.quad .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 10px;border-radius:10px;max-width:260px;opacity:0;transition:opacity .12s;z-index:5}
.qlab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--mute)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.r,td.r{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
tr.loc{cursor:pointer}tr.loc:hover td{background:var(--soft)}
tr.det td{background:var(--soft);padding:18px}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--blue)}
.dots{display:inline-flex;gap:3px}.dots i{width:10px;height:10px;border-radius:3px;background:var(--bad-t)}.dots i.y{background:var(--good)}.dots i.n{background:repeating-linear-gradient(45deg,var(--soft) 0 3px,var(--line) 3px 6px)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.filters select,.filters input{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.det-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}
.det-grid h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.eg{display:grid;grid-template-columns:1fr repeat(4,22px) 54px;gap:4px;align-items:center;font-size:12.5px}
.eg i{height:16px;border-radius:4px;background:var(--bad-t)}.eg i.y{background:var(--good)}.eg i.n{background:var(--line)}
.eg .h{font-size:10px;color:var(--mute);text-align:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
/* hbar charts */
.hb{display:grid;gap:8px;margin-top:16px}
.hb .r{display:grid;grid-template-columns:220px 1fr 90px;gap:12px;align-items:center;font-size:14px}
.hb .r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .r .tr{height:20px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.hb .r .tr i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:6px}
.hb .r .v{text-align:right;font-family:var(--display);font-weight:700}
/* hygiene */
.hyg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.hyg .card .num{font-size:44px;color:var(--bad);line-height:1}
.hyg .card.ok .num{color:var(--good)}
/* recs */
.recs{display:grid;gap:14px;margin-top:22px;counter-reset:r}
.rec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;display:grid;grid-template-columns:56px 1fr 220px;gap:18px;align-items:start}
.rec::before{counter-increment:r;content:counter(r,decimal-leading-zero);font-family:var(--display);font-weight:800;font-size:34px;color:var(--blue);line-height:1}
.rec h3{font-family:var(--display);font-size:21px;font-weight:600}
.rec p{color:var(--ink2);margin-top:6px;font-size:15px}
.rec .ex{margin-top:10px;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.rec .ex b{color:var(--ink)}
.rec .imp{border-left:1px solid var(--line);padding-left:16px}
.rec .imp .num{font-size:26px;display:block}
/* worth (house section) */
.worth h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,3.6vw,42px);letter-spacing:-.02em}
.worth .sub{color:var(--ink2);font-size:17px;margin-top:10px}
.worth{--mute:var(--mute);--good:var(--good)}
table.demand{font-size:13.5px}
.ins{display:grid;gap:12px;margin-top:22px}
.insc{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.insc .num{font-size:44px;line-height:1;color:var(--blue)}
.insc h3{font-family:var(--display);font-size:20px;font-weight:600}.insc p{color:var(--ink2);margin-top:4px;font-size:15px}
@media (max-width:600px){.insc{grid-template-columns:1fr;gap:6px}}
.h2hbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:20px;font-size:13px;font-weight:700;color:#fff}
.h2hbar span{display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;margin-top:18px}
.hr{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.hn b{display:block;font-size:14px}
.hb2>div{display:grid;grid-template-columns:110px 1fr 26px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.hb2 i{display:block;height:10px;border-radius:5px}
.hb2 b{font-family:var(--display);text-align:right}
.hb2 .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){.h2h{grid-template-columns:1fr}.hr{grid-template-columns:1fr}}
/*{{WORTH_CSS}}*/
footer{padding:60px 0 80px;color:var(--mute);font-size:13px}
button.th{position:fixed;right:14px;bottom:14px;z-index:30;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;height:36px;padding:0 13px;cursor:pointer;font:inherit}
@media (max-width:900px){.spots,.g3,.g4,.hyg{grid-template-columns:1fr 1fr}.det-grid{grid-template-columns:1fr}.rec{grid-template-columns:44px 1fr}.rec .imp{grid-column:2;border-left:0;padding-left:0}}
@media (max-width:600px){.spots,.g2,.g3,.g4,.hyg,.kpis{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.hb .r{grid-template-columns:110px 1fr 64px;font-size:12.5px}.rec{grid-template-columns:1fr}.rec::before{font-size:26px}.rec .imp{grid-column:1}}
@media print{nav.top,button.th{display:none}section.sec{break-inside:avoid-page}}
</style>
</head>
<body>
<nav class="top"><div class="wrap" id="nav"></div></nav>
<header class="hero"><div class="orb" aria-hidden="true"></div><div class="wrap" id="hero"></div></header>
<main class="wrap" id="main"></main>
<div class="wrap"><!--{{WORTH}}--></div>
<div class="wrap" id="tail"></div>
<footer><div class="wrap" id="foot"></div></footer>
<button class="th" id="theme" aria-label="Switch light or dark">◐</button>
<script>
var D=/*{{DATA}}*/null;
(function(){
if(!D)return;
var K=D.kpi,A=D.account,SHORT=A.short||A.name;
function $(s,r){return (r||document).querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n==null?'–':Math.round(n).toLocaleString('en-US')}
function money(n){return '$'+fmt(n)}
function pctTxt(a,b){return b?Math.round(100*a/b)+'%':'–'}
var EN=[['chat_gpt','GPT'],['gemini','Ge'],['claude','C'],['perplexity','P']],ENL={chat_gpt:'ChatGPT',gemini:'Gemini',claude:'Claude',perplexity:'Perplexity'};
function scoreClass(s){return s>=67?'p-good':s>=40?'p-warn':'p-bad'}
var L=D.locations.slice().sort(function(a,b){return (b.score||0)-(a.score||0)});
var med=K.median_score;

/* hero */
$('#hero').innerHTML='<p class="eyebrow">Portfolio AI visibility report · '+esc(D.date||'')+'</p>'+
 '<h1>'+esc(A.name)+':<br>the AI growth map for all '+K.locations+' locations</h1>'+
 '<p class="lede">We asked ChatGPT, Gemini, Claude and Perplexity the questions patients ask in every location\'s own market, checked Google for the same searches, and measured each location against its local competitors. '+(D.prepared_for?'Prepared for '+esc(D.prepared_for)+'.':'')+'</p>'+
 '<div class="kpis">'+
 kpi(K.lead+' of '+K.locations,'markets where AI already picks '+SHORT+' first')+kpi(money(K.trail_worth),'a month in markets where a local competitor leads AI today')+
 kpi(K.reach,'close races: within 3 mentions of the local leader')+kpi(K.review_adv+' of '+K.review_cmp,'markets where '+SHORT+' has more Google reviews than local competitors')+
 kpi(K.ai_rate+'%','of AI answers name the '+SHORT+' location')+kpi(money(K.worth),'a month in local searches across all locations')+
 kpi(K.any_price+' of '+K.locations,'Google profiles that show a price AI can quote')+kpi(K.phone_mm,'locations with a phone to align between Google and '+SHORT+'\'s site')+
 '</div>';
function kpi(v,t){return '<div class="kpi"><span class="num">'+v+'</span><p>'+esc(t)+'</p></div>'}

var S=[];function sec(id,nav,html){S.push([id,nav]);return '<section class="sec" id="'+id+'">'+html+'</section>'}
var M='';

/* 1 spotlights */
M+=sec('examples','Real examples','<p class="eyebrow">Where '+esc(SHORT)+' can grow next</p><h2>Real opportunities, <span class="g">location by location.</span></h2>'+
 '<p class="sub">Each card is a specific location and a specific finding from this scan, measured against its local competitors. The rest of the report shows how often each opportunity repeats across the portfolio.</p>'+
 '<div class="spots">'+D.spotlights.map(function(s){return '<div class="spot '+(s.k==='champion'?'champion':'')+'"><span class="tag">'+esc(s.tag)+'</span><span class="loc">'+esc(s.loc)+'</span><span class="big">'+esc(s.big)+'</span><p>'+esc(s.text)+'</p>'+(s.slug?'<a class="go" href="#loc-'+esc(s.slug)+'" data-open="'+esc(s.slug)+'">See this location →</a>':'')+'</div>'}).join('')+'</div>');

/* 1b owner insights */
if((D.insights||[]).length)M+=sec('insights','Insights','<p class="eyebrow">What the data says about growth</p><h2>Where the upside is, <span class="g">in five numbers.</span></h2>'+
 '<div class="ins">'+D.insights.map(function(x){return '<div class="card insc"><span class="num">'+esc(x.big)+'</span><div><h3>'+esc(x.h)+'</h3><p>'+esc(x.p)+'</p></div></div>'}).join('')+'</div>');
/* 1c head to head */
var H=D.locations.filter(function(l){return l.h2h!=='lead'}).sort(function(a,b){return (b.worth||0)-(a.worth||0)}).slice(0,12);
var hmax=Math.max.apply(null,H.map(function(l){return Math.max(l.own_n,l.rival_n)}).concat([1]));
M+=sec('compete','Local competition','<p class="eyebrow">Against local competition</p><h2>'+K.lead+' markets already won. <span class="g">The next '+H.length+' are worth the most.</span></h2>'+
 '<p class="sub">For each location we counted how often AI and Google\'s map pack named it, and how often they named its most-named local competitor, across the same 15 answers. Below: the highest-value markets where a competitor is ahead today.</p>'+
 '<div class="h2hbar"><span style="flex:'+K.lead+';background:var(--good)">'+K.lead+' lead</span><span style="flex:'+K.tie+';background:var(--warn)">'+K.tie+' tied</span><span style="flex:'+K.trail+';background:var(--bad)">'+K.trail+' trail</span></div>'+
 '<div class="h2h">'+H.map(function(l){return '<div class="hr"><div class="hn"><b>'+esc(l.name)+'</b><span class="small">'+money(l.worth)+'/mo '+(l.margin>=-3?'<span class="pill p-warn">Close race</span>':'')+'</span></div>'+
  '<div class="hb2"><div><span class="small">'+esc(SHORT)+'</span><i style="width:'+(100*l.own_n/hmax)+'%;background:var(--blue)"></i><b>'+l.own_n+'</b></div><div><span class="small" title="'+esc(l.rival||'')+'">'+esc((l.rival||'').slice(0,28))+'</span><i style="width:'+(100*l.rival_n/hmax)+'%;background:var(--coral)"></i><b>'+l.rival_n+'</b></div></div></div>'}).join('')+'</div>');

/* 2 quadrant */
M+=sec('map','Where you stand','<p class="eyebrow">Where every location stands</p><h2>Many locations already win on Google. <span class="g">AI is the next step up.</span></h2>'+
 '<p class="sub">Each dot is a location. Across: how often Google shows it in the map pack for our three searches. Up: how often the four AI tools named it. Dot size: Google reviews. Hover or tap a dot.</p>'+
 '<div class="card quad" style="margin-top:20px"><svg id="qsvg" viewBox="0 0 900 520" role="img" aria-label="Scatter of locations by Google map presence and AI mentions"></svg><div class="tip" id="qtip"></div></div>');

/* 3 brands */
M+=sec('brands','Practice groups','<p class="eyebrow">Practice groups</p><h2>Every practice group, <span class="g">measured against its own local markets.</span></h2>'+
 '<div class="tw"><table id="btab"><thead><tr><th>Practice group</th><th class="r">Locations</th><th class="r">Markets led</th><th>AI score</th><th class="r">AI names it</th><th class="r">Map pack</th><th class="r">Rating</th><th class="r">Reviews</th><th class="r">Phone mismatches</th><th class="r">Searches worth / mo</th></tr></thead><tbody></tbody></table></div>');

/* 4 locations */
M+=sec('locations','Every location','<p class="eyebrow">Every location</p><h2>All '+K.locations+' locations against their local competitors. <span class="g">Tap a row for the detail.</span></h2>'+
 '<div class="filters"><input id="fq" placeholder="Search location or city" aria-label="Search"><select id="fb" aria-label="Practice group"><option value="">All practice groups</option></select><select id="fs" aria-label="State"><option value="">All states</option></select></div>'+
 '<div class="tw"><table id="ltab"><thead><tr><th data-k="rank">#</th><th data-k="name">Location</th><th data-k="score">AI score</th><th>AI tools</th><th class="r" data-k="map_hits">Map pack</th><th class="r" data-k="rating">Rating</th><th class="r" data-k="reviews">Reviews</th><th data-k="margin">vs top local rival</th><th class="r" data-k="review_x">Reviews vs local</th></tr></thead><tbody></tbody></table></div>');

/* 5 rivals */
M+=sec('rivals','Who wins instead','<p class="eyebrow">The competitors to beat</p><h2>The local rivals AI recommends most, <span class="g">market by market.</span></h2>'+
 '<p class="sub">Counted across every AI answer and Google map pack in each location\'s market. These are the businesses taking the recommendation, market by market.</p><div class="hb" id="rivlist"></div>');

/* 6 hygiene */
var shared={};D.locations.forEach(function(l){var p=(l.src_phone||'').replace(/\D/g,'');if(p)(shared[p]=shared[p]||[]).push(l)});
var sharedList=Object.keys(shared).filter(function(k){return shared[k].length>1}).map(function(k){return shared[k]});
var sharedN=sharedList.reduce(function(a,v){return a+v.length},0);
M+=sec('identity','Identity','<p class="eyebrow">Identity and data consistency</p><h2>One data cleanup lifts every location. <span class="g">AI trusts details that match everywhere.</span></h2>'+
 '<p class="sub">Some phone differences are call-tracking numbers. They still split the identity AI sees unless the main number is the same everywhere and tracking numbers are set up as secondary numbers.</p>'+'<div class="hyg">'+hy(K.phone_mm,'locations where Google\'s phone differs from '+SHORT+'\'s own site')+hy(sharedN,'locations share a phone number with another location on '+SHORT+'\'s site')+
 hy(K.pin_off,'location pins on '+SHORT+'\'s map are 2 km or more from Google\'s')+hy(K.site_mm,'Google listings link to a different website than '+SHORT+' lists')+
 hy(K.no_desc,'Google listings have no business description')+hy(K.unclaimed,'Google listings are not claimed')+'</div>'+

var links=[].slice.call(document.querySelectorAll('nav.top a'));
addEventListener('scroll',function(){var y=scrollY+120,cur=null;links.forEach(function(a){var t=document.querySelector(a.getAttribute('href'));if(t&&t.offsetTop<=y)cur=a});links.forEach(function(a){a.classList.toggle('on',a===cur)})},{passive:true});
var r=document.documentElement;try{var t=localStorage.getItem('pf-theme');if(t)r.dataset.theme=t}catch(e){}
$('#theme').onclick=function(){var d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem('pf-theme',r.dataset.theme)}catch(e){}};
})();
</script>
</body>
</html>
