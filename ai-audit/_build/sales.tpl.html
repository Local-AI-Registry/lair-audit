<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>AI Visibility Audit · Local AI Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Cormorant:wght@500;600&display=swap">
<style>

/* Layout: one 16:9 stage, letterboxed to fit the window, sized in cqw so it reads like a 1280x720 screen share.
   Single light look on purpose: the white Local AI Registry brand. */
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#0B1A2E; --body:#2C3A4F; --muted:#6E7887; --rule:rgba(11,26,46,.12);
  --blue:#1F4FE0; --blue2:#6F8FEF; --blue3:#B3C3F5; --blue-t:#E7EDFC; --coral:#FF5A3C; --peach:#F5DEC6;
  --red:#D7261B; --red-t:#FDECEA; --ok:#0E8A5F; --ok-t:#E3F3EC; --amber:#B5822A; --amber-t:#F8EFDC; --grey:#AEB5BF;
  --fu:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif; --fb:"Hanken Grotesk",system-ui,sans-serif; --fd:"Cormorant",Georgia,serif;
  --shadow:0 1px 2px rgba(11,26,46,.05),0 6px 20px rgba(11,26,46,.06);
  color-scheme:light;
}

/* ===== 16:9 screen ===== */
.frame{container-type:inline-size;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 18px 50px rgba(11,26,46,.12);position:relative;font-family:var(--fb);color:var(--ink)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:2.2cqw;padding:1.4cqw 2.4cqw;font-size:1.15cqw}
.lg{display:flex;align-items:center;gap:.6cqw;font:700 1.3cqw var(--fu);white-space:nowrap}
.lg svg{width:1.4cqw;height:1.4cqw}
.chap{display:flex;align-items:center;gap:.15cqw;margin:0 auto;background:var(--card);border-radius:99cqw;padding:.35cqw;box-shadow:0 0 0 1px rgba(11,26,46,.06),0 .4cqw 1.4cqw rgba(11,26,46,.08)}
.chap button{position:relative;display:flex;align-items:center;gap:.55cqw;padding:.42cqw .95cqw .42cqw .42cqw;border-radius:99cqw;color:var(--muted);font:600 .98cqw var(--fb);white-space:nowrap;transition:background .3s,color .3s}
.chap button i{flex:none;width:1.65cqw;height:1.65cqw;border-radius:50%;display:grid;place-items:center;font:800 .78cqw/1 var(--fu);font-style:normal;background:var(--bg);color:var(--muted);transition:all .3s}
.chap button+span::before{content:"";position:absolute;left:-.25cqw;top:50%;width:.35cqw;height:1px;background:var(--rule)}
.chap button.done{color:var(--ink)}
.chap button.done i{background:var(--ok-t);color:var(--ok)}
.chap button.on{background:var(--ink);color:#fff;box-shadow:0 .3cqw 1cqw rgba(11,26,46,.28)}
.chap button.on i{background:#fff;color:var(--blue)}
.chap button.on::before,.chap button.on+span::before{display:none}
.pg{display:flex;align-items:center;gap:.6cqw;color:var(--muted);font-weight:600;white-space:nowrap}
.pg i{font-style:normal;width:2.4cqw;height:2.4cqw;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.prog{height:.25cqw;background:var(--rule);margin:0 2.4cqw}
.prog i{display:block;height:100%;background:var(--blue);border-radius:9cqw}
.body{flex:1;padding:1.8cqw 2.4cqw 2.2cqw;display:flex;flex-direction:column;gap:1.3cqw;min-height:0}
.kick{font:700 1cqw var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttl{font:800 2.7cqw/1.08 var(--fu);letter-spacing:-.02em}
.ttl em{font-style:normal;color:var(--blue)}
.sub{font-size:1.35cqw;line-height:1.4;color:var(--body)}
.card{background:var(--card);border-radius:1.2cqw;box-shadow:var(--shadow);min-width:0;min-height:0}
.pad{padding:1.7cqw}
.col{display:flex;flex-direction:column;gap:1cqw}
.lbl{font:600 1.1cqw var(--fb);color:var(--muted)}
.hint{font-size:1.05cqw;color:var(--muted)}
.more{margin-top:auto;font:700 1.1cqw var(--fb);color:var(--blue)}
.pill{display:inline-block;font:700 .95cqw/1 var(--fb);padding:.45cqw .8cqw;border-radius:99cqw;white-space:nowrap}
.p-f{background:var(--red-t);color:var(--red)} .p-w{background:var(--amber-t);color:var(--amber)} .p-p{background:var(--ok-t);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6cqw;background:var(--coral);color:#fff;font:700 1.25cqw var(--fb);padding:1.05cqw 1.8cqw;border-radius:99cqw;white-space:nowrap;border:0}
.big{font:800 7cqw/1 var(--fu);letter-spacing:-.03em}
.big small{font-size:1.7cqw;color:var(--muted);font-weight:700;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw;flex:1;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw;flex:1;min-height:0}
.rowx{display:flex;align-items:center;gap:1cqw}
.num{font-variant-numeric:tabular-nums}

/* range slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:.8cqw;border-radius:9cqw;background:linear-gradient(90deg,var(--ok) var(--p,20%),var(--ok-t) var(--p,20%));outline:none;cursor:pointer;margin:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:2.2cqw;height:2.2cqw;border-radius:50%;background:#fff;border:.3cqw solid var(--ok);box-shadow:var(--shadow)}
.rng::-moz-range-thumb{width:1.8cqw;height:1.8cqw;border-radius:50%;background:#fff;border:.3cqw solid var(--ok)}
.rng:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.sl{display:flex;justify-content:space-between;font:600 1cqw var(--fb);color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:.9cqw}
.bars>div{display:grid;grid-template-columns:12cqw 1fr 5.5cqw;gap:1cqw;align-items:center;font-size:1.15cqw}
.bars u{display:block;height:1.4cqw;border-radius:9cqw;background:var(--bg);text-decoration:none;position:relative;overflow:hidden}
.bars u i{position:absolute;inset:0 auto 0 0;background:var(--blue3);border-radius:9cqw;transition:width .5s}
.bars>div.me{font-weight:800}
.bars>div.me u i{background:var(--blue)}
.bars>div.me.bad u i{background:var(--coral)}
.bars b{text-align:right;font-family:var(--fu);font-variant-numeric:tabular-nums}

/* AI engine chips */
.eng{display:flex;gap:.35cqw}
.eng i{width:1.75cqw;height:1.75cqw;border-radius:50%;display:grid;place-items:center;font:800 .72cqw var(--fb);font-style:normal;color:#fff}
.eng i.off{background:var(--bg)!important;color:var(--grey);box-shadow:inset 0 0 0 1px var(--rule)}

/* ---------- front page + loaders ---------- */
.home{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,#F1E3C4,#E2CFA8 60%,#CDB78F);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw}
.scard{background:#FFFDF9;border-radius:2.4cqw;padding:2.4cqw 3cqw;width:42cqw;display:flex;flex-direction:column;align-items:center;gap:1cqw;box-shadow:0 2cqw 5cqw rgba(60,40,10,.18)}
.scard h4{margin:0;font:800 3.3cqw/1.05 var(--fu);letter-spacing:-.03em;text-align:center}
.scard h4 em{font-style:normal;color:var(--blue)}
.sbox{width:100%;display:flex;align-items:center;gap:1cqw;border:1px solid var(--rule);border-radius:99cqw;padding:1.2cqw 1.6cqw;font-size:1.3cqw;color:var(--muted);background:#fff}
.sbox b{color:var(--ink);font-weight:600}
.caret{display:inline-block;width:.15cqw;height:1.5cqw;background:var(--ink);margin-left:.1cqw;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.seen{display:flex;flex-direction:column;align-items:center;gap:1cqw}
.seen .lbl{color:#6b5a3c;letter-spacing:.1em;text-transform:uppercase;font-size:.95cqw;font-weight:700}
.logos{display:flex;gap:3cqw;align-items:center;font:800 1.7cqw var(--fu);color:rgba(11,26,46,.55);flex-wrap:wrap;justify-content:center}
.logos span:nth-child(2){font-family:var(--fd);font-size:2.1cqw}
.trust{display:flex;gap:1.6cqw;font-size:1.1cqw;color:#5b4a2c}
.trust b{color:var(--ink)}

.ld{position:absolute;inset:0;display:grid;grid-template-columns:30cqw 1fr;background:var(--bg)}
.ldp{background:var(--card);padding:2.4cqw;display:flex;flex-direction:column;gap:1.2cqw;box-shadow:1px 0 0 var(--rule)}
.ldp .who{font:800 2.2cqw/1.1 var(--fu)}
.ldp .st{display:flex;flex-direction:column;gap:.7cqw;font-size:1.15cqw;color:var(--muted)}
.ldp .st div{display:flex;gap:.8cqw;align-items:center}
.ldp .st div i{width:1.5cqw;height:1.5cqw;border-radius:50%;box-shadow:inset 0 0 0 .2cqw var(--rule);flex:none;display:grid;place-items:center;font-style:normal;font-size:.9cqw;color:#fff}
.ldp .st div.d{color:var(--ink)} .ldp .st div.d i{background:var(--ok);box-shadow:none}
.ldp .st div.n{color:var(--ink);font-weight:700} .ldp .st div.n i{box-shadow:inset 0 0 0 .25cqw var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 .25cqw var(--blue3)}}
.pct{margin-top:auto;display:flex;flex-direction:column;gap:.7cqw}
.pct b{font:800 3.6cqw/1 var(--fu)}
.pbar{height:.8cqw;border-radius:9cqw;background:var(--bg);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:9cqw;transition:width .4s}
.ldm{position:relative;padding:2.4cqw;display:flex;flex-direction:column;gap:1.2cqw;min-width:0;overflow:hidden}

/* L1 chat */
.chat{flex:1;display:flex;flex-direction:column;gap:1.2cqw;min-height:0}
.etabs{display:flex;gap:.6cqw}
.etabs span{display:flex;align-items:center;gap:.5cqw;padding:.6cqw 1cqw;border-radius:99cqw;font:700 1.05cqw var(--fb);color:var(--muted);background:var(--card);box-shadow:var(--shadow);transition:all .3s}
.etabs span.on{background:var(--ink);color:#fff}
.bub{max-width:80%;padding:1.2cqw 1.5cqw;border-radius:1.4cqw;font-size:1.4cqw;line-height:1.4}
.bub.q{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:.3cqw}
.bub.a{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:.3cqw;display:flex;flex-direction:column;gap:.6cqw;min-width:44cqw}
.bub.a .ln{display:flex;align-items:center;gap:.8cqw;opacity:0;transform:translateY(.5cqw);transition:all .4s}
.bub.a .ln.in{opacity:1;transform:none}
.bub.a .ln b{font-family:var(--fu)}
.bub.a .ln.you{background:var(--ok-t);margin:0 -.6cqw;padding:.3cqw .6cqw;border-radius:.6cqw}
.verdict{align-self:flex-start;font:800 1.3cqw var(--fu);padding:.8cqw 1.3cqw;border-radius:99cqw;opacity:0;transition:opacity .4s}
.verdict.in{opacity:1}
.verdict.y{background:var(--ok-t);color:var(--ok)} .verdict.n{background:var(--red-t);color:var(--red)}
.tally{display:flex;gap:.6cqw;align-items:center;font-size:1.1cqw;color:var(--muted)}

/* L3 map */
.map{position:absolute;inset:0;background:#EEF0EC}
.map svg.streets{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;left:58%;top:52%;width:70cqw;height:70cqw;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(31,79,224,.22),rgba(31,79,224,0) 22%);animation:rot 4s linear infinite}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ring{position:absolute;left:58%;top:52%;border-radius:50%;border:1px solid rgba(31,79,224,.25);transform:translate(-50%,-50%)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .4s,transform .4s}
.pin.in{opacity:1}
.pin span{background:var(--card);box-shadow:var(--shadow);border-radius:.8cqw;padding:.5cqw .8cqw;font:700 1cqw var(--fb);white-space:nowrap}
.pin span small{color:var(--muted);font-weight:600}
.pin i{width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--blue2);border:.25cqw solid #fff;margin-top:.3cqw;box-shadow:var(--shadow)}
.pin.me span{background:var(--ink);color:#fff}.pin.me span small{color:var(--blue3)}
.pin.me i{background:var(--coral);width:1.6cqw;height:1.6cqw}
.qb{position:absolute;background:var(--blue);color:#fff;font:600 1cqw var(--fb);padding:.5cqw .9cqw;border-radius:1cqw 1cqw 1cqw .2cqw;white-space:nowrap;opacity:0;transition:opacity .5s}
.qb.in{opacity:1}
.dotp{position:absolute;width:.8cqw;height:.8cqw;border-radius:50%;background:var(--blue2);opacity:.6}

/* L4 reel */
.reel{flex:1;position:relative}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw;opacity:0;transform:translateY(1cqw);transition:all .6s}
.rc.on{opacity:1;transform:none}
.rc .src{font:800 2cqw var(--fu);color:var(--muted)}
.rc h5{margin:0;font:800 3cqw/1.12 var(--fu);letter-spacing:-.02em;max-width:52cqw}
.rc .bigg{font:800 9cqw/1 var(--fu);color:var(--ok);letter-spacing:-.03em}
.face{display:flex;align-items:center;gap:1.2cqw}
.face img{width:6cqw;height:6cqw;border-radius:50%;object-fit:cover}
.face b{display:block;font:800 1.8cqw var(--fu)}
.face span{font-size:1.25cqw;color:var(--muted)}

/* ---------- snapshot ---------- */
.gauge text{font-family:var(--fb)}
.race{display:flex;flex-direction:column;gap:.5cqw}
.race>div{display:grid;grid-template-columns:2.4cqw 15cqw 1fr 1fr 1fr;gap:1cqw;align-items:center;padding:.9cqw 1.1cqw;border-radius:1cqw;font-size:1.25cqw}
.race>div.h{font:700 .95cqw var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:.2cqw}
.race>div.me{background:var(--ink);color:#fff}
.race>div.me small{color:var(--blue3)}
.race b{font:800 1.5cqw var(--fu)}
.race .rk{font:800 1.3cqw var(--fu);color:var(--muted)}
.race>div.me .rk{color:var(--coral)}
.race small{display:block;font-size:.95cqw;color:var(--muted)}
.minib{height:.7cqw;border-radius:9cqw;background:var(--bg);margin-top:.4cqw;overflow:hidden}
.minib i{display:block;height:100%;background:var(--blue3)}
.race>div.me .minib{background:rgba(255,255,255,.15)}.race>div.me .minib i{background:var(--coral)}
.funnel{flex:1;display:grid;grid-template-columns:1fr 3cqw 1fr 3cqw 1.15fr;align-items:stretch;min-height:0}
.arrow{display:grid;place-items:center;font:800 2.4cqw var(--fu);color:var(--blue3)}
.fstep{padding:1.8cqw;display:flex;flex-direction:column;gap:.9cqw}
.fstep .k{font:800 1.05cqw var(--fu);color:var(--blue)}
.people{display:grid;grid-template-columns:repeat(10,1fr);gap:.45cqw;margin-top:.4cqw}
.people i{aspect-ratio:1;border-radius:50%;background:var(--blue3)}
.people i.y{background:var(--ok)}
.ring2 text{font-family:var(--fu)}

/* ---------- benchmarks ---------- */
.prow{display:grid;grid-template-columns:1fr auto 5cqw;gap:1cqw;align-items:center;padding:.85cqw 0;border-bottom:1px solid var(--rule);font-size:1.25cqw}
.prow b{font-family:var(--fu);text-align:right;font-variant-numeric:tabular-nums}
.prow small{display:block;font-size:.95cqw;color:var(--muted)}
.ph{display:flex;align-items:center;gap:.8cqw;font:800 1.5cqw var(--fu)}
.ph i{width:1.2cqw;height:1.2cqw;border-radius:50%}
.lc text{font-family:var(--fb)}

/* ---------- hub ---------- */
.hub{flex:1;display:grid;grid-template-columns:1.12fr 1fr;gap:1.3cqw;min-height:0}
.fw{width:100%;height:100%;display:block}
.fw .nd{cursor:pointer}
.fw .nd:focus{outline:none}
.fw .nd:focus-visible circle.c{stroke-width:5}
@keyframes dash{to{stroke-dashoffset:-60}}
.flowline{animation:dash 3s linear infinite}
.tabs{display:flex;background:var(--bg);border-radius:99cqw;padding:.35cqw;gap:.3cqw;align-self:flex-start}
.tabs button{all:unset;cursor:pointer;padding:.6cqw 1.3cqw;border-radius:99cqw;font:700 1.05cqw var(--fb);color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--blue)}
.dt{padding:1.8cqw;display:flex;flex-direction:column;gap:1.05cqw;overflow:hidden}
.dt .hero{display:flex;align-items:flex-end;gap:1.4cqw}
.dt .hero .big{font-size:6.2cqw}
.dt .hero .cap{font:600 1.35cqw/1.3 var(--fb);color:var(--body);padding-bottom:.6cqw;max-width:22cqw}
.dt .say{font:700 1.6cqw/1.3 var(--fu);color:var(--ink)}
.dt .nav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font:700 1.05cqw var(--fb);color:var(--muted)}
.svc{display:flex;flex-direction:column;gap:.7cqw;margin:0;padding:0;list-style:none}
.svc li{display:flex;gap:.8cqw;font-size:1.3cqw;line-height:1.35;color:var(--body)}
.svc li::before{content:"";flex:none;width:1.1cqw;height:1.1cqw;margin-top:.25cqw;border-radius:50%;background:var(--blue-t);box-shadow:inset 0 0 0 .3cqw var(--blue)}
.diff{background:var(--blue-t);border-radius:1cqw;padding:1.1cqw 1.3cqw;font-size:1.2cqw;color:var(--ink)}
.chips{display:flex;gap:.6cqw}

/* ---------- why ---------- */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw}
.fc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5cqw}
.fc img{width:6.4cqw;height:6.4cqw;border-radius:50%;object-fit:cover;box-shadow:0 0 0 .3cqw #fff,var(--shadow)}
.fc b{font:700 1.1cqw/1.2 var(--fu)}
.fc span{font-size:.9cqw;color:var(--muted);line-height:1.25}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3cqw}
.rc2{padding:1.4cqw;display:flex;flex-direction:column;gap:.5cqw}
.rc2 .up{font:800 2.4cqw/1 var(--fu);color:var(--ok)}
.rc2 b{font:700 1.2cqw var(--fu)}
.rc2 span{font-size:1cqw;color:var(--muted)}
.press{display:flex;gap:2.4cqw;align-items:center;font:800 1.4cqw var(--fu);color:var(--muted);flex-wrap:wrap}

/* ---------- plan ---------- */
.plan{padding:1.8cqw;display:flex;flex-direction:column;gap:1cqw}
.plan .price{font:800 5.4cqw/1 var(--fu);letter-spacing:-.03em}
.plan .price small{font-size:1.6cqw;color:var(--muted)}
.terms{display:flex;flex-direction:column;gap:.7cqw;margin:0;padding:0;list-style:none}
.terms li{display:flex;gap:.8cqw;font-size:1.15cqw;line-height:1.35;color:var(--body)}
.terms li b{color:var(--ink)}
.terms li::before{content:"✓";flex:none;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--ok-t);color:var(--ok);display:grid;place-items:center;font:800 .9cqw var(--fb)}
.cpc>div{display:grid;grid-template-columns:16cqw 1fr 5cqw;gap:1cqw;align-items:center;font-size:1.2cqw}
.cpc u{height:1.6cqw;border-radius:.4cqw;background:var(--bg);display:block;overflow:hidden;text-decoration:none}
.cpc u i{display:block;height:100%;background:var(--grey)}
.cpc>div.me{font-weight:800}
.cpc>div.me u i{background:var(--ok)}
.cpc b{text-align:right;font-family:var(--fu)}
.stack{display:flex;flex-direction:column-reverse;gap:.25cqw;width:100%}
.stack div{border-radius:.5cqw;padding:0 .8cqw;display:flex;align-items:center;justify-content:space-between;font:600 1cqw var(--fb);color:var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule)}
.phase{display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw;flex:1;min-height:0}
.phase>div{padding:1.3cqw;display:flex;flex-direction:column;gap:.7cqw;position:relative}
.phase .m{font:800 1.05cqw var(--fu);color:var(--blue);letter-spacing:.04em}
.phase h6{margin:0;font:800 1.5cqw/1.15 var(--fu)}
.phase ul{margin:0;padding-left:1.2cqw;font-size:1.05cqw;color:var(--body);display:flex;flex-direction:column;gap:.35cqw;line-height:1.3}
.tl{height:.5cqw;border-radius:9cqw;background:linear-gradient(90deg,var(--blue) 0 18%,var(--blue2) 18% 36%,var(--blue3) 36% 100%)}
.guar{display:flex;align-items:center;gap:1.4cqw;background:var(--ink);color:#fff;border-radius:1.2cqw;padding:1.3cqw 1.8cqw}
.guar b{font:800 3.4cqw/1 var(--fu);color:var(--coral)}
.guar span{font-size:1.3cqw;line-height:1.35}

@media (prefers-reduced-motion:reduce){.sweep,.flowline,.caret,.ldp .st div.n i{animation:none}}
@media (max-width:760px){.pair{grid-template-columns:1fr}}

/* ---------- round 3 ---------- */
.stepper{display:flex;align-items:center;gap:.8cqw;white-space:nowrap}
.stepper .sd{display:flex;gap:.4cqw}
.stepper .sd i{display:block;width:1cqw;height:.55cqw;border-radius:9cqw;background:var(--rule);transition:all .3s}
.stepper .sd i.on{width:2.6cqw;background:var(--blue)}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:.5cqw;background:var(--ink);color:#fff;font:700 1.05cqw var(--fb);padding:.65cqw 1.2cqw;border-radius:99cqw}
.stepper button.bk{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stepper button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stepper .sl2{font:600 1.05cqw var(--fb);color:var(--muted)}
.fade{animation:fin .45s both}
@keyframes fin{from{opacity:0;transform:translateY(.8cqw)}to{opacity:1;transform:none}}

/* loader 3 */
.ld3{position:absolute;inset:0;display:grid;grid-template-columns:31cqw 1fr;background:var(--bg)}
.ck{display:flex;flex-direction:column;gap:.15cqw}
.ck div{display:grid;grid-template-columns:1.9cqw 1fr auto;gap:.8cqw;align-items:center;padding:.48cqw .7cqw;border-radius:.7cqw;font-size:1.12cqw;color:var(--muted)}
.ck div i{width:1.6cqw;height:1.6cqw;border-radius:50%;box-shadow:inset 0 0 0 .2cqw var(--rule);display:grid;place-items:center;font:800 .8cqw var(--fb);font-style:normal;color:#fff}
.ck div.n{background:var(--blue-t);color:var(--ink);font-weight:700}
.ck div.n i{box-shadow:inset 0 0 0 .25cqw var(--blue);animation:pulse 1s infinite}
.ck div.d{color:var(--ink)}
.ck div small{font-size:.92cqw;font-weight:700;white-space:nowrap}
.scene{position:relative;padding:2.2cqw 2.6cqw;display:flex;flex-direction:column;gap:1.2cqw;min-width:0;overflow:hidden}
.scene .sh2{display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw}
.scene .what{font:800 2.4cqw/1.1 var(--fu);letter-spacing:-.02em}
.scene .how{font-size:1.2cqw;color:var(--muted);margin-top:.3cqw}
.ln3{opacity:0;animation:fin .45s both}
.res3{align-self:flex-start;font:800 1.45cqw var(--fu);padding:.8cqw 1.4cqw;border-radius:99cqw;opacity:0;animation:fin .45s both}
.rows{display:flex;flex-direction:column;gap:.5cqw}
.rows>div{display:grid;grid-template-columns:1fr auto;gap:1cqw;align-items:center;background:var(--card);border-radius:.9cqw;padding:.85cqw 1.2cqw;box-shadow:var(--shadow);font-size:1.25cqw}
.rows>div b{font-family:var(--fu)}
.okx{font:700 1.05cqw var(--fb);padding:.35cqw .8cqw;border-radius:99cqw}
.okx.y{background:var(--ok-t);color:var(--ok)}.okx.n{background:var(--red-t);color:var(--red)}.okx.m{background:var(--amber-t);color:var(--amber)}
.serp{background:var(--card);border-radius:1.2cqw;box-shadow:var(--shadow);padding:1.4cqw 1.6cqw;display:flex;flex-direction:column;gap:1cqw}
.serp .bar{display:flex;align-items:center;gap:.8cqw;border:1px solid var(--rule);border-radius:99cqw;padding:.8cqw 1.2cqw;font-size:1.25cqw}
.ctl{position:absolute;right:1.6cqw;bottom:1.4cqw;display:flex;gap:.5cqw}
.ctl button{all:unset;cursor:pointer;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font:700 1.1cqw var(--fb);color:var(--ink)}
.ctl button:focus-visible{outline:2px solid var(--blue)}
.tiles9{display:grid;grid-template-columns:repeat(5,1fr);gap:.8cqw}
.tiles9 div{aspect-ratio:4/3;border-radius:.8cqw;background:linear-gradient(135deg,#ded3bf,#efe7d8);position:relative}
.tiles9 div span{position:absolute;left:.5cqw;bottom:.5cqw;font:700 .85cqw var(--fb);padding:.25cqw .5cqw;border-radius:99cqw}
.meterh{height:1.6cqw;border-radius:9cqw;background:linear-gradient(90deg,var(--ok-t),var(--amber-t),var(--red-t));position:relative}
.meterh b{position:absolute;top:50%;transform:translate(-50%,-50%);width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--red);border:.3cqw solid #fff;box-shadow:var(--shadow)}

/* score story */
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.stat4 .card{padding:1.3cqw 1.5cqw;display:flex;flex-direction:column;gap:.3cqw}
.stat4 b{font:800 3cqw/1 var(--fu)}
.stat4 span{font-size:1.1cqw;color:var(--muted)}
.lead{display:flex;flex-direction:column;gap:.45cqw}
.lead>div{display:grid;grid-template-columns:2.2cqw 13cqw 1.1fr 1.3fr .8fr;gap:1.2cqw;align-items:center;padding:.85cqw 1.1cqw;border-radius:1cqw;font-size:1.2cqw}
.lead>div.h{font:700 .92cqw var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:.1cqw}
.lead>div.me{background:var(--ink);color:#fff}
.lead b{font:800 1.45cqw var(--fu)}
.lead .rk{font:800 1.3cqw var(--fu);color:var(--muted)}
.lead>div.me .rk{color:var(--coral)}
.lead small{font-size:.92cqw;color:var(--muted)}
.lead>div.me small{color:var(--blue3)}
.spk{display:flex;align-items:center;gap:.8cqw}
.spk svg{width:9cqw;height:2.6cqw;flex:none}
.chain{display:grid;grid-template-columns:1fr auto 1fr auto 1.25fr;gap:1cqw;align-items:stretch}
.chain .card{padding:1.3cqw 1.5cqw;display:flex;flex-direction:column;gap:.35cqw}
.chain .op{display:grid;place-items:center;font:800 2.2cqw var(--fu);color:var(--blue3)}
.chain b{font:800 3.2cqw/1 var(--fu)}
.chain span{font-size:1.1cqw;color:var(--muted);line-height:1.3}
.split{display:flex;height:3.4cqw;border-radius:1cqw;overflow:hidden;margin-top:.4cqw}
.split div{display:flex;align-items:center;padding:0 1cqw;font:800 1.15cqw var(--fu);color:#fff;white-space:nowrap}
.mini3{display:flex;gap:1cqw;flex-wrap:wrap}
.mini3 span{background:var(--card);box-shadow:var(--shadow);border-radius:99cqw;padding:.55cqw 1.1cqw;font:600 1.05cqw var(--fb)}
.mini3 b{font-family:var(--fu)}

/* ask chapter */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2cqw;flex:1;min-height:0}
.colh{display:flex;align-items:center;gap:.8cqw;font:800 1.45cqw var(--fu);padding-bottom:.6cqw}
.colh i{width:1.2cqw;height:1.2cqw;border-radius:50%}
.colh small{margin-left:auto;font:700 1cqw var(--fb);color:var(--muted)}
.qrow{display:flex;flex-direction:column;gap:.45cqw;padding:.9cqw 0;border-top:1px solid var(--rule)}
.qrow .t{display:flex;justify-content:space-between;gap:1cqw;font-size:1.25cqw}
.qrow .t b{font-family:var(--fu);font-variant-numeric:tabular-nums}
.qrow .e{display:flex;justify-content:space-between;align-items:center;gap:1cqw}
.also{font-size:1cqw;color:var(--muted);line-height:1.35}
.also b{color:var(--red);font-weight:700}
.tallyc{display:flex;flex-direction:column;gap:.55cqw}
.tallyc>div{display:grid;grid-template-columns:12cqw 1fr 2cqw;gap:.8cqw;align-items:center;font-size:1.1cqw}
.tallyc u{height:1.1cqw;border-radius:9cqw;background:var(--bg);display:block;overflow:hidden;text-decoration:none}
.tallyc u i{display:block;height:100%;background:var(--red);opacity:.75}

/* why carousel */
.trackw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.track{display:flex;gap:1.3cqw;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:.4cqw .2cqw 1.2cqw;flex:1;min-height:0;scrollbar-width:thin}
.track>.card{flex:0 0 30.5cqw;scroll-snap-align:start;padding:1.4cqw;display:flex;flex-direction:column;gap:.55cqw}
.track .typ{font:800 1.5cqw/1.15 var(--fu)}
.track .loc{font-size:1.05cqw;color:var(--muted)}
.track .up{font:800 2.4cqw/1 var(--fu);color:var(--ok)}
.track .match{background:var(--ink);color:#fff}
.track .match .loc,.track .match .hint{color:var(--blue3)}
/* round 4: map home + scan */
.map .pan{position:absolute;inset:-6%;animation:pan 26s ease-in-out infinite alternate}
@keyframes pan{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,-2%) scale(1.04)}}
.dotp.dr{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(1.4cqw,-.9cqw)}}
.qb.cyc{animation:qcyc 9s infinite both}
@keyframes qcyc{0%,6%{opacity:0;transform:translateY(.6cqw)}12%,40%{opacity:1;transform:none}48%,100%{opacity:0}}
.home2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.home2 .scard{position:relative;z-index:2}
.seen2{position:absolute;left:0;right:0;bottom:1.6cqw;text-align:center;font:600 .95cqw var(--fb);color:rgba(11,26,46,.42);letter-spacing:.02em;z-index:2}
.seen2 b{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8cqw;margin-right:1cqw}
.veil{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 48%,rgba(244,241,234,.0),rgba(244,241,234,.55));z-index:1;pointer-events:none}
.scan4{position:absolute;inset:0}
.sp{position:absolute;left:2cqw;top:2cqw;bottom:2cqw;width:31cqw;background:rgba(255,255,255,.96);border-radius:1.6cqw;box-shadow:0 1.4cqw 4cqw rgba(11,26,46,.16);padding:2cqw;display:flex;flex-direction:column;gap:1.1cqw;z-index:3}
.ph4{display:flex;flex-direction:column;gap:.35cqw}
.ph4>div{display:grid;grid-template-columns:2cqw 1fr;gap:.9cqw;align-items:start;padding:.65cqw .8cqw;border-radius:.9cqw;color:var(--muted)}
.ph4>div i{width:1.7cqw;height:1.7cqw;border-radius:50%;box-shadow:inset 0 0 0 .2cqw var(--rule);display:grid;place-items:center;font:800 .85cqw var(--fb);font-style:normal;color:#fff;margin-top:.1cqw}
.ph4>div b{display:block;font:700 1.3cqw/1.25 var(--fu)}
.ph4>div span{display:block;font-size:1.02cqw;line-height:1.35}
.ph4>div.d{color:var(--ink)} .ph4>div.d i{background:var(--ok);box-shadow:none}
.ph4>div.n{background:var(--blue-t);color:var(--ink)} .ph4>div.n i{box-shadow:inset 0 0 0 .25cqw var(--blue);animation:pulse 1s infinite}
.ph4>div.d span,.ph4>div.p span{display:none}
.quip{font:600 1.05cqw var(--fb);color:var(--blue);margin-top:.35cqw;min-height:1.4cqw}
.quip em{font-style:normal;animation:fin .4s both;display:inline-block}
.toast{position:absolute;right:2cqw;bottom:2cqw;width:30cqw;z-index:3}
.toast .card{padding:1.3cqw 1.5cqw;display:flex;flex-direction:column;gap:.6cqw;animation:tin .6s both;box-shadow:0 1.2cqw 3cqw rgba(11,26,46,.16)}
@keyframes tin{from{opacity:0;transform:translateY(1.4cqw) scale(.97)}to{opacity:1;transform:none}}
.toast .k2{font:700 .85cqw var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toast h5{margin:0;font:800 1.45cqw/1.2 var(--fu)}
.bigq{position:absolute;left:44%;top:29%;z-index:3;max-width:34cqw;background:var(--blue);color:#fff;font:600 1.5cqw/1.35 var(--fb);padding:1.1cqw 1.5cqw;border-radius:1.4cqw 1.4cqw 1.4cqw .3cqw;box-shadow:var(--shadow);animation:tin .5s both}
.bigq small{display:block;font-size:1cqw;color:var(--blue3);margin-bottom:.3cqw;font-weight:700}
/* round 5 */
.ib{all:unset;cursor:pointer;width:1.9cqw;height:1.9cqw;border-radius:50%;display:inline-grid;place-items:center;font:italic 800 1.1cqw/1 Georgia,serif;color:var(--blue);background:var(--blue-t);vertical-align:middle;flex:none}
.ib:hover,.ib:focus-visible{background:var(--blue);color:#fff}
.ib:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pop{position:absolute;top:6.2cqw;right:2.4cqw;width:56cqw;z-index:10;background:var(--card);border-radius:1.4cqw;box-shadow:0 0 0 1px var(--rule),0 2cqw 5cqw rgba(11,26,46,.22);padding:1.8cqw 2cqw;display:flex;flex-direction:column;gap:1cqw;animation:tin .3s both}
.pop[hidden]{display:none}
.pop h5{margin:0;font:800 1.9cqw/1.1 var(--fu)}
.pop p{font-size:1.2cqw;line-height:1.45;color:var(--body);max-width:none}
.pop .x{position:absolute;top:1.2cqw;right:1.2cqw}
.sgrid{display:grid;grid-template-columns:15cqw repeat(6,1fr);gap:.35cqw .5cqw;align-items:center;font-size:1.05cqw}
.sgrid .hd{font:700 .85cqw/1.15 var(--fb);color:var(--muted);text-align:center}
.sgrid i{justify-self:center;width:1.7cqw;height:1.7cqw;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule)}
.sgrid i.y{background:var(--ok);box-shadow:none}
.eq{display:flex;align-items:center;gap:1.2cqw;flex-wrap:wrap;font-size:1.2cqw}
.eq b{font:800 2.2cqw/1 var(--fu)}
.feed{position:absolute;inset:0;z-index:3;pointer-events:none}
.feed .fnd{position:absolute;white-space:nowrap;transform:translate(-50%,-50%)}
.feed .fnd.new{animation:fpop .5s both}
@keyframes fpop{from{opacity:0;transform:translate(-50%,-20%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%)}}
.fnd{display:flex;align-items:center;gap:.8cqw;background:rgba(255,255,255,.97);border-radius:99cqw;padding:.75cqw 1.3cqw .75cqw .8cqw;font:600 1.15cqw var(--fb);box-shadow:0 .6cqw 1.6cqw rgba(11,26,46,.14);opacity:.55;transition:opacity .3s}
.fnd i{flex:none;width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font:800 .9cqw var(--fb);font-style:normal}
.fnd.new{opacity:1;animation:tin .45s both}
.fnd small{color:var(--muted);font-weight:600}
/* plan v6 */
.vs{display:grid;grid-template-columns:1fr 3cqw 1.35fr;gap:1cqw;flex:1;min-height:0;align-items:stretch}
.vsx{display:grid;place-items:center;font:800 1.4cqw var(--fu);color:var(--muted)}
.old .oldp{font:800 5cqw/1 var(--fu);color:var(--muted);letter-spacing:-.03em;margin-top:.4cqw}
.old .oldp s{text-decoration-thickness:.25cqw;text-decoration-color:rgba(215,38,27,.6)}
.old .oldp small,.new .newp small{font-size:1.3cqw;text-decoration:none}
.vl{display:grid;grid-template-columns:1fr 1fr;gap:0 1.6cqw;margin-top:.6cqw}
.vl div{display:flex;justify-content:space-between;gap:.6cqw;font-size:1.02cqw;color:var(--body);padding:.4cqw 0;border-bottom:1px solid var(--rule)}
.vl b{font-family:var(--fu);color:var(--muted);font-variant-numeric:tabular-nums}
.new{background:var(--blue);color:#fff;gap:0;padding:1.8cqw 2.4cqw}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding-bottom:1.3cqw;border-bottom:1px solid rgba(255,255,255,.2)}
.nhead .lbl{color:#fff;font:700 1.5cqw var(--fu);margin-top:.8cqw}
.new .newp{font:800 5cqw/1 var(--fu);letter-spacing:-.03em}
.new .newp small{color:var(--blue3)}
.rec{flex:none;width:8cqw;height:8cqw;border-radius:2.2cqw;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 .6cqw rgba(255,255,255,.14)}
.rec svg{width:4.6cqw;height:4.6cqw}
.why1{font:600 1.3cqw/1.4 var(--fb);color:#fff;background:rgba(255,255,255,.1);border-radius:1cqw;padding:1cqw 1.2cqw}
.t4{list-style:none;margin:0;padding:1.4cqw 0 1.5cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.3cqw 2.2cqw}
.t4 li{position:relative;padding-left:2.4cqw;font-size:1.15cqw;line-height:1.35;color:#DCE4FB}
.t4 li b{color:#fff}
.t4 li::before{content:"✓";position:absolute;left:0;top:0;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font:800 .85cqw var(--fb)}
.btn2{display:inline-flex;align-items:center;background:#fff;color:var(--blue);font:800 1.25cqw var(--fb);padding:1cqw 2cqw;border-radius:99cqw}
.tl12{padding:1.2cqw 1.6cqw 1.3cqw;display:flex;flex-direction:column;gap:1.5cqw}
.tlh{display:flex;align-items:center}
.tlh b{font:800 1.4cqw var(--fu)}
.tlh span{font-size:1cqw;color:var(--muted)}
.tlr{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw;padding-top:1.4cqw;border-top:.25cqw solid var(--blue-t)}
.tlr>div{display:flex;flex-direction:column;gap:.15cqw;position:relative}
.tlr>div::before{content:"";position:absolute;top:-1.85cqw;left:0;width:.9cqw;height:.9cqw;border-radius:50%;background:var(--blue);box-shadow:0 0 0 .25cqw #fff}
.tlr .m{font:800 .85cqw var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.tlr b{font:800 1.2cqw var(--fu)}
.tlr .d{font-size:.95cqw;color:var(--body);line-height:1.3}
.g90{display:inline-flex;align-items:center;gap:.5cqw;background:var(--ok-t);color:var(--ok);font:800 .95cqw var(--fb);padding:.35cqw .9cqw;border-radius:99cqw;white-space:nowrap;margin-left:1.4cqw}
.g90m{position:absolute;top:-.25cqw;left:35%;width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--ok);box-shadow:0 0 0 .3cqw #fff,0 0 0 .55cqw var(--ok-t);transform:translate(-50%,-50%)}
.g90 i{width:.6cqw;height:.6cqw;border-radius:50%;background:var(--ok)}
.track .match svg rect{fill:rgba(95,211,163,.16)}
.badge{align-self:flex-start;font:800 .95cqw var(--fb);background:var(--coral);color:#fff;border-radius:99cqw;padding:.4cqw .8cqw}
.arrows{position:absolute;right:0;top:-3.6cqw;display:flex;gap:.5cqw}
.arrows button{all:unset;cursor:pointer;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font:700 1.2cqw var(--fb)}
.arrows button:focus-visible{outline:2px solid var(--blue)}
.facesrow{display:flex;align-items:center;gap:1.3cqw}
.facesrow img{width:4cqw;height:4cqw;border-radius:50%;object-fit:cover;box-shadow:0 0 0 .25cqw #fff}
.facesrow .stack2{display:flex}
.facesrow .stack2 img{margin-left:-1.1cqw}
.facesrow .stack2 img:first-child{margin-left:0}

/* ---------- app shell ---------- */
html,body{height:100%}
body{margin:0;background:#E7E1D4;color:var(--ink);font:16px/1.5 var(--fb);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size;background:var(--bg);overflow:hidden;font-family:var(--fb);color:var(--ink)}
#stage button{font-family:inherit}
.lg{color:inherit;text-decoration:none}
.chap button{border:0;background:none;cursor:pointer}
.chap button:focus-visible,.stepper button:focus-visible,.btn:focus-visible,.btn2:focus-visible,.skip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stepper button[disabled]{opacity:.45;cursor:default}
.scard .h4{margin:0;font:800 3.3cqw/1.05 var(--fu);letter-spacing:-.03em;text-align:center}
.scard .h4 em{font-style:normal;color:var(--blue)}
.sbox input{all:unset;flex:1;font:600 1.3cqw var(--fb);color:var(--ink)}
.sbox input::placeholder{color:var(--muted);font-weight:500}
.sbox:focus-within{box-shadow:0 0 0 .2cqw var(--blue)}
#sug{list-style:none;margin:0;padding:0;width:100%;border-radius:1.2cqw;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
#sug:empty{display:none}
#sug li{padding:.9cqw 1.4cqw;border-bottom:1px solid var(--rule);cursor:pointer;display:flex;flex-direction:column;gap:.15cqw;background:#fff}
#sug li:last-child{border-bottom:0}
#sug li b{font:700 1.2cqw var(--fu)}
#sug li small{font-size:1cqw;color:var(--muted)}
#sug li:hover,#sug li.on{background:var(--blue-t)}
.btn{border:0;cursor:pointer}
.btn2{text-decoration:none}
.skip{position:absolute;right:2cqw;top:2cqw;z-index:4;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:var(--ink);font:700 1.05cqw var(--fb);padding:.7cqw 1.3cqw;border-radius:99cqw;box-shadow:var(--shadow)}
.sgrid i.u{background:repeating-linear-gradient(45deg,var(--bg) 0 .25cqw,#fff .25cqw .5cqw);box-shadow:inset 0 0 0 1px var(--rule)}
.tbtn{all:unset;cursor:pointer}
.cnav{margin-left:auto;display:flex;align-items:center;gap:.6cqw;font:700 1cqw var(--fb);color:var(--muted)}
.cnav .tbtn{width:2.2cqw;height:2.2cqw;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-size:1.05cqw}
.cnav .tbtn:hover{background:var(--blue-t)}
.dt{gap:.85cqw}
.dt .hero .big{font-size:4.6cqw}
.dt .hero .cap{font-size:1.15cqw;max-width:26cqw}
.dt .say{font:700 1.3cqw/1.35 var(--fu)}
.dt .bars{gap:.55cqw}
.dt .bars>div{font-size:1.05cqw;grid-template-columns:13cqw 1fr 4.5cqw}
.dt .bars>div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .bars u{height:1.1cqw}
.qrow{padding:.65cqw 0}
.tbtn:focus-visible{outline:2px solid var(--blue)}
.rotate{display:none}
@media (max-width:700px) and (orientation:portrait){.rotate{display:flex;position:fixed;inset:auto 0 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font:600 14px/1.4 var(--fb);justify-content:center;text-align:center;z-index:20}}
</style>

<script>
(()=>{
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const X=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US');
const fmt1=n=>n==null?'–':(Math.round(n*10)/10).toLocaleString('en-US');
const LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 10 L92 86 L64 86 L50 58 L36 86 L8 86 Z" fill="#1F4FE0"/><path d="M50 10 L61 30 L39 30 Z" fill="#FF5A3C"/></svg>';
const QP=new URLSearchParams(location.search);
let SLUG=null,D=null;
const STAGE=$('#stage');

/* ---------- chapters and routing ---------- */
const CH=[['find','Find'],['scan','Scan'],['score','Your score'],['ask','Patients ask AI'],['checks','11 checks'],['why','Why us'],['plan','Plan']];
const STEPS={score:3,ask:2,checks:2};
let cur='find',step=0;
function go(id,s){if(!D&&id!=='find')id='find';cur=id;step=s||0;if(location.hash.slice(1)!==id)history.replaceState(null,'',location.search+'#'+id);render()}
function next(){const n=STEPS[cur]||1;if(step<n-1){step++;render();return}const i=CH.findIndex(c=>c[0]===cur);if(i<CH.length-1)go(CH[i+1][0])}
function prev(){if(step>0){step--;render();return}const i=CH.findIndex(c=>c[0]===cur);if(i>1)go(CH[i-1][0],(STEPS[CH[i-1][0]]||1)-1)}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='Escape'){const p=$('.pop:not([hidden])');if(p){p.hidden=true;return}}
 if(!D)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}else if(/^[1-6]$/.test(e.key))go(CH[+e.key][0])});
STAGE.addEventListener('click',e=>{const hm=e.target.closest('[data-home]');if(hm){e.preventDefault();go('find');return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
 const nv=e.target.closest('[data-nav]');if(nv){nv.dataset.nav==='next'?next():prev();return}
 const st=e.target.closest('[data-step]');if(st){const n=STEPS[cur]||1;step=+st.dataset.step<0?Math.max(0,step-1):(step+1)%n;render()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==cur&&CH.some(c=>c[0]===h))go(h)});

function top(){const i=CH.findIndex(c=>c[0]===cur),n=STEPS[cur]||1;
 const chap='<nav class="chap" aria-label="Chapters">'+CH.slice(1).map((c,k)=>{const j=k+1;return '<button type="button" data-go="'+c[0]+'" class="'+(j===i?'on':j<i?'done':'')+'"'+(j===i?' aria-current="step"':'')+'><i>'+(j<i?'✓':j)+'</i>'+c[1]+'</button>'}).join('')+'</nav>';
 const right=n>1?'<div class="stepper"><div class="sd">'+Array.from({length:n},(_,k)=>'<i class="'+(k===step?'on':'')+'"></i>').join('')+'</div><button type="button" class="bk" data-nav="prev" aria-label="Back">←</button><button type="button" data-nav="next">'+(step<n-1?'Next step →':'Next →')+'</button></div>'
  :'<div class="stepper"><button type="button" class="bk" data-nav="prev" aria-label="Back">←</button><button type="button" data-nav="next"'+(i===CH.length-1?' disabled':'')+'>'+(i===CH.length-1?'Last chapter':'Next →')+'</button></div>';
 const pct=((i-1)+(step+1)/n)/(CH.length-1)*100;
 return '<div class="top"><a class="lg" href="./" data-home title="Start a new search">'+LOGO+'Local AI Registry</a>'+chap+right+'</div><div class="prog"><i style="width:'+pct+'%"></i></div>'}

/* ---------- business data helpers ---------- */
let B,WHO,ME,AUD,CK,REV,RAT,AIM,AIN,NB,CRN,TOTAL,PRICE0,SHARE,S,MONTHS,price,RMIN,RMAX;
const SHORTC={'Reputation management':'Reputation','Independent articles':'3rd-party articles','Independent guides':'Best-of guides'};
const WHEEL={'Directory listings':'Directories','Web management':'Website','Reputation management':'Reputation','Photo codifying':'Photos','Independent articles':'Articles','Independent guides':'Best-of guides'};
function setBiz(slug){SLUG=slug;D=SETS[slug];hubSel=0;B=D.biz;ME=D.hit.short;S=D.S;MONTHS=D.months||[];
 WHO=[ME].concat((D.who||[]).slice(1));
 AUD=D.aud2||{};CK=D.ct||[];
 const m=(c,re)=>(AUD[c]||[]).find(x=>re.test(x.m));
 REV=(m('Reputation management',/reviews/i)||{}).v||[B.reviews];RAT=(m('Reputation management',/rating/i)||{}).v||[B.rating];
 const am=(AUD['AI monitoring']||[])[0];AIM=am?am.v:null;
 NB=(D.rd||[]).filter(r=>r.t!=='Brand');CRN=(D.cr||[]).filter(r=>r.t!=='Brand');
 AIN=am&&/^AI answers/.test(am.m)?4*(NB.length+CRN.length):null;
 TOTAL=(D.vp||[]).reduce((a,r)=>a+(r[1]||0),0);
 PRICE0=Math.max(1,Math.round((D.vp&&D.vp[0]&&D.vp[0][3])||(D.price&&D.price.value)||50));
 SHARE=D.scan&&D.scan.answers_total?D.scan.answers_naming_you/D.scan.answers_total:null;
 document.title=ME+' · AI Visibility Audit';price=PRICE0;RMIN=Math.max(5,Math.round(PRICE0/4));RMAX=Math.max(150,Math.round(PRICE0*3))}
const stName=st=>/^P/.test(st)?'p':/^F/.test(st)?'f':'w';
const ST={f:['Failed','p-f','#D7261B'],w:['Needs work','p-w','#E3A93B'],p:['Passed','p-p','#0E8A5F']};

/* ---------- map ---------- */
const STREETS='<svg class="streets" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true"><g stroke="#fff" fill="none"><path d="M0 18 L100 22" stroke-width="1.6"/><path d="M0 40 L100 36" stroke-width="1.2"/><path d="M30 0 L36 56" stroke-width="1.4"/><path d="M70 0 L64 56" stroke-width="1.8"/><path d="M48 0 L52 56" stroke-width=".7"/><path d="M0 30 L100 30" stroke-width=".6"/><path d="M84 0 L90 56" stroke-width=".6"/><path d="M12 0 L18 56" stroke-width=".6"/><path d="M0 9 L100 12" stroke-width=".5"/><path d="M0 48 L60 46" stroke-width=".5"/></g><g fill="#DDE6D5"><rect x="38" y="42" width="9" height="7" rx="1"/><rect x="74" y="6" width="8" height="9" rx="1"/><rect x="5" y="22" width="6" height="6" rx="1"/></g><path d="M0 50 Q30 45 55 52 T100 49 L100 56 L0 56Z" fill="#CFE0EA"/></svg>';
const dots=(n,seed)=>{let h='';for(let i=0;i<n;i++)h+='<i class="dotp dr" style="left:'+(4+((i*37+seed)%92))+'%;top:'+(6+((i*53+seed*3)%86))+'%;animation-delay:-'+(i%6)+'s;animation-duration:'+(4+i%5)+'s"></i>';return h};

/* ---------- FIND (home) ---------- */
const HITS=Object.keys(SETS).map(k=>Object.assign({},SETS[k].hit,{slug:k,re:new RegExp(SETS[k].hit.match,'i')}));
const HQ=['best med spa near me','botox near me','dentist open saturday','best dermatologist downtown','dispensary near me','lip filler cost','who does the best rhinoplasty?','emergency dentist near me'];
function vFind(){
 STAGE.innerHTML='<div class="scr"><div class="map"><div class="pan">'+STREETS+dots(34,3)+HQ.map((q,i)=>'<div class="qb cyc" style="left:'+[8,62,14,70,40,76,22,52][i]+'%;top:'+[14,12,70,64,8,38,40,82][i]+'%;animation-delay:'+(RM?0:i*1.1)+'s">"'+q+'"</div>').join('')+'</div></div><div class="veil"></div>'+
 '<div class="home2"><div class="scard"><div class="lg" style="font-size:1.4cqw">'+LOGO+'Local AI Registry</div><h1 class="h4">Get recommended by AI.<br><em>Guaranteed.</em></h1><div class="sub" style="color:var(--muted)">Is AI recommending you today? Find out free.</div>'+
 '<div class="sbox"><svg viewBox="0 0 24 24" style="width:1.4cqw;height:1.4cqw;flex:none" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="#6E7887" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="#6E7887" stroke-width="2"/></svg><input id="q" type="text" autocomplete="off" placeholder="Type your business name" aria-label="Business name" role="combobox" aria-expanded="false" aria-controls="sug"></div><ul id="sug" role="listbox"></ul></div></div>'+
 '<div class="seen2"><b>As seen in</b>'+PRESS.join(' · ')+'</div></div>';
 const q=$('#q'),sug=$('#sug');let items=[],act=-1;
 const draw=()=>{sug.innerHTML=items.map((r,i)=>'<li role="option" data-i="'+i+'" class="'+(i===act?'on':'')+'"><b>'+(r.typed?'Use "'+X(r.name)+'"':X(r.name))+'</b><small>'+(r.typed?'Not listed? We\'ll find it for you':X(r.sub))+'</small></li>').join('');q.setAttribute('aria-expanded',items.length?'true':'false')};
 const pick=r=>{if(r.typed){location.href='https://audit.localairegistry.com/a/?q='+encodeURIComponent(r.name);return}setBiz(r.slug);try{history.replaceState(null,'','?b='+r.slug+'#scan')}catch(e){}go('scan')};
 q.addEventListener('input',()=>{const v=q.value.trim();act=-1;items=v.length<2?[]:HITS.filter(h=>h.re.test(v)||h.name.toLowerCase().includes(v.toLowerCase())||h.short.toLowerCase().includes(v.toLowerCase())).concat([{name:v,typed:1}]);draw()});
 q.addEventListener('keydown',e=>{if(!items.length)return;if(e.key==='ArrowDown'){act=Math.min(items.length-1,act+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(0,act-1);draw();e.preventDefault()}else if(e.key==='Enter'){pick(items[Math.max(0,act)])}});
 sug.addEventListener('click',e=>{const li=e.target.closest('li');if(li)pick(items[+li.dataset.i])});
 if(D){q.value=D.hit.name}setTimeout(()=>q.focus(),50)}

/* ---------- SCAN ---------- */
const PH=[
 ['Reading your website','Looking at your site the way Google and AI do.',['How fast does it load on a phone?','Can search engines read every page?','Do your pages say what you offer?']],
 ['Checking your Google profile','What Google tells people before they ever call you.',['Hours, photos and categories','Reading your reviews','Is your website link working?']],
 ['Looking you up across the web','Every place AI goes to learn about a business.',['Is your address the same everywhere?','Any news stories about you?','Any videos on YouTube?','Are you in the best-of lists?']],
 ['Sizing up your competition','Who else shows up near you, and how they\'re doing.',['Finding your closest competitors','Comparing reviews and ratings','Comparing website traffic']],
 ['Asking the AI assistants','The same questions your customers ask, word for word.',['Asking ChatGPT','Asking Gemini','Asking Claude','Asking Perplexity','Asking Google AI']],
 ['Writing your audit','Turning it all into one simple score.',['Scoring 11 things AI checks','Adding up what it\'s worth to you']],
];
function findings(){const v=(c,re)=>{const x=(AUD[c]||[]).find(m=>re.test(m.m));return x?x.v[0]:null};const F=[[],[],[],[],[],[]];
 const lt=v('Web management',/load time/i);if(lt!=null)F[0].push('Your homepage loaded in '+fmt1(lt)+' seconds');F[0].push('Read your homepage and service pages','Checked the images on your homepage');
 if(B.reviews)F[1].push('Found '+fmt(B.reviews)+' Google reviews');if(B.rating)F[1].push('Your average rating: '+B.rating+' stars');const ph=v('Google profile',/photos/i);if(ph!=null)F[1].push('Found '+fmt(ph)+' photos on your Google profile');
 const ns=v('PR',/news/i);F[2].push(ns?'Found '+fmt(ns)+' news '+(ns===1?'story':'stories')+' about you':'Searched the news for stories about you');
 const vd=v('Video',/youtube/i);F[2].push(vd?'Found '+fmt(vd)+' YouTube '+(vd===1?'video':'videos')+' about you':'Searched YouTube for videos about you');
 const bl=v('Independent articles',/linking/i);if(bl!=null)F[2].push('Found '+fmt(bl)+' websites linking to you');F[2].push('Checked your directory listings');
 F[3].push('Found your '+(WHO.length-1)+' closest competitors');WHO.slice(1).forEach((n,i)=>{if(REV[i+1]!=null)F[3].push(n+': '+fmt(REV[i+1])+' reviews')});
 const EN=[[1,'ChatGPT'],[2,'Gemini'],[5,'Claude'],[3,'Perplexity']];EN.forEach(([k,n])=>{const hit=NB.some(r=>r.r&&r.r[k]);F[4].push(hit?n+' mentioned you':'Asked '+n+' about you')});
 if(D.scan&&D.scan.answers_total)F[4].push('Collected '+D.scan.answers_total+' AI answers');
 F[5].push('Scored 11 things AI checks','Worked out what AI is worth to you');return F}
let scanTimer=null;
function vScan(){const FIND=findings();let k=0,q=0,paused=RM,ticks=0,feed=[],seq=0;
 const SPOTS=[[72,12],[56,80],[84,44],[52,58],[82,86],[70,72],[86,14],[52,90],[62,64]].sort(()=>Math.random()-.5);
 const pins=[[ME,'★ '+(RAT[0]??''),64,52,1]].concat(WHO.slice(1).map((n,i)=>[n,RAT[i+1]!=null?'★ '+RAT[i+1]:'',[50,87,80][i],[24,28,66][i]]));
 const q0=(NB[0]||CRN[0]||{}).q||('best '+(B.svc||'business')+' near me');
 function draw(){const done=k>=PH.length;const P=PH[Math.min(k,PH.length-1)];const pct=Math.round(Math.min(k,PH.length)/PH.length*100);
  let m='<div class="map"><div class="pan" style="animation-duration:40s">'+STREETS+dots(26,7)+'<div class="ring" style="left:64%;top:50%;width:24cqw;height:24cqw"></div><div class="ring" style="left:64%;top:50%;width:46cqw;height:46cqw"></div>'+(k===3?'<div class="sweep" style="left:64%;top:50%"></div>':'')+
   pins.map((p,i)=>'<div class="pin'+(p[4]?' me':'')+((i===0||k>=3)?' in':'')+'" style="left:'+p[2]+'%;top:'+p[3]+'%;transition-delay:'+(k===3?i*.5:0)+'s"><span>'+X(p[0])+' <small>'+p[1]+'</small></span><i></i></div>').join('')+'</div></div>';
  if(k===4)m+='<div class="bigq"><small>'+P[2][q%5].replace('Asking ','')+' is asked</small>"'+X(q0)+'"</div>';
  const list='<div class="ph4">'+PH.map((x,i)=>'<div class="'+(i<k?'d':i===k?'n':'p')+'"><i>'+(i<k?'✓':'')+'</i><div><b>'+x[0]+'</b><span>'+x[1]+'</span>'+(i===k?'<div class="quip"><em>'+x[2][q%x[2].length]+'…</em></div>':'')+'</div></div>').join('')+'</div>';
  const panel='<div class="sp"><a class="lg" href="./" data-home>'+LOGO+'Local AI Registry</a><div><div class="kick">Building your AI visibility audit</div><div style="font:800 2cqw/1.1 var(--fu);margin-top:.3cqw">'+X(ME)+'</div></div>'+(done?'<div class="col fade" style="gap:1cqw;margin-top:1cqw"><div style="font:800 2.6cqw/1.1 var(--fu)">Your audit is ready.</div><div class="sub">We checked 11 things AI looks at before it recommends you.</div><button type="button" class="btn" data-go="score" style="align-self:flex-start">See your score →</button></div>':list)+
   '<div class="pct" style="gap:.5cqw"><div class="rowx" style="justify-content:space-between"><b style="font-size:2.6cqw">'+pct+'%</b><span class="hint">'+(done?'ready':'about '+((PH.length-k)*5)+'s left')+'</span></div><div class="pbar"><i style="width:'+pct+'%"></i></div></div></div>';
  const fd='<div class="feed" aria-live="polite">'+feed.map((t,i)=>'<div class="fnd'+(i===feed.length-1?' new':'')+'" style="left:'+t.x+'%;top:'+t.y+'%"><i>✓</i><span>'+X(t.t)+'</span></div>').join('')+'</div>';
  STAGE.innerHTML='<div class="scr"><div class="scan4">'+m+panel+fd+'<div class="ctl" style="right:auto;left:35cqw;z-index:4"><button type="button" data-c="p" aria-label="Previous step">‹</button><button type="button" data-c="t" aria-label="'+(paused?'Play':'Pause')+'">'+(paused?'▶':'⏸')+'</button><button type="button" data-c="n" aria-label="Next step">›</button></div><button type="button" class="skip" data-go="score">Skip to results →</button></div></div>'}
 STAGE.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;if(c==='t')paused=!paused;else{paused=true;q=0;feed=[];k=c==='p'?Math.max(0,k-1):Math.min(PH.length,k+1)}draw()};
 if(RM)k=PH.length;draw();clearInterval(scanTimer);
 scanTimer=setInterval(()=>{if(cur!=='scan'){clearInterval(scanTimer);return}if(paused||k>=PH.length)return;ticks++;q++;const FL=FIND[k];if(FL&&q-1<FL.length){const P=SPOTS[(seq++)%SPOTS.length];feed.push({t:FL[q-1],x:P[0],y:P[1]});feed=feed.slice(-3)}if(q>=Math.max(4,PH[k][2].length,FL?FL.length:0)){q=0;k++}draw()},1250)}

/* ---------- SCORE ---------- */
function gauge(sz){const sc=D.score,cx=200,cy=190,R=150,ang=v=>Math.PI*(1-v/100),pt=(v,r)=>[cx+r*Math.cos(ang(v)),cy-r*Math.sin(ang(v))];
 const arc=(a,b,col,w)=>{if(b<=a)return '';const p1=pt(a,R),p2=pt(b,R);return '<path d="M'+p1[0]+' '+p1[1]+' A'+R+' '+R+' 0 0 1 '+p2[0]+' '+p2[1]+'" stroke="'+col+'" stroke-width="'+w+'" fill="none"/>'};
 const col=sc.you>=sc.top?'#0E8A5F':sc.you>=sc.avg?'#B5822A':'#D7261B';
 let s='<svg viewBox="0 -34 400 300" style="width:'+sz+';height:auto" role="img" aria-label="AI score '+sc.you+' of 100. Area average '+sc.avg+', top nearby '+sc.top+'.">'+arc(0,40,'#FDECEA',34)+arc(40,70,'#F8EFDC',34)+arc(70,100,'#E3F3EC',34)+arc(0,Math.max(.5,sc.you),col,10);

 if(mode==='svc'){const sv=SVC[i]||[[],''];return '<div class="card dt"><div class="rowx"><span class="kick">What we do · check '+String(i+1).padStart(2,'0')+'</span>'+nav+'</div><div class="ttl" style="font-size:2.5cqw">'+X(nm)+'</div><ul class="svc">'+sv[0].map(x=>'<li>'+X(x)+'</li>').join('')+'</ul><div class="diff"><b>Why it\'s different:</b> '+X(sv[1])+'</div></div>'}
 const ms=AUD[c.c]||[],m=ms.find(x=>x.t==='num'&&x.v&&x.v[0]!=null)||ms[0];let hero='',bars='';
 if(m){const v=m.v||[];const nums=v.filter(x=>x!=null&&typeof x==='number');const mx=Math.max(...nums,m.t==='bool'?1:0)||1;
  hero='<div class="hero"><div class="big" style="color:'+(st[0]==='Passed'?'var(--ok)':st[0]==='Failed'?'var(--red)':'var(--ink)')+'">'+fmtM(m,v[0])+'</div><div class="cap">'+X(m.m)+'</div></div>';
  bars='<div class="lbl" style="margin-top:.4cqw">You vs. your 3 closest competitors'+(m.low?' · lower is better':'')+'</div><div class="bars">'+v.map((x,k)=>x==null?'':'<div class="'+(k?'':'me'+(st[0]!=='Passed'?' bad':''))+'"><span>'+X(WHO[k]||'')+'</span><u><i style="width:'+(m.t==='bool'?(x?100:4):Math.max(3,x/mx*100))+'%"></i></u><b>'+fmtM(m,x)+'</b></div>').join('')+'</div>'}
 return '<div class="card dt"><div class="rowx"><span class="kick">Check '+String(i+1).padStart(2,'0')+'</span><span class="pill '+st[1]+'">'+st[0]+'</span>'+nav+'</div><div class="ttl" style="font-size:2.3cqw">'+X(nm)+'</div>'+hero+'<div class="say">'+X(c.i)+'</div>'+bars+'</div>'}
function vChecks(){const mode=step===0?'svc':'status';const cnt={p:0,w:0,f:0};CK.forEach(c=>cnt[stName(c.st)]++);
 STAGE.innerHTML='<div class="scr">'+top()+'<div class="body"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw"><div><div class="kick">'+(mode==='status'?'How we analyze your business':'What makes us different')+'</div><div class="ttl">'+(mode==='status'?'The 11 things AI checks, <em>and how you did</em>':'One record. <em>Powering all 11.</em>')+'</div></div>'+
 '<div class="col" style="align-items:flex-end;gap:.6cqw"><div class="tabs" role="tablist"><button type="button" role="tab" class="'+(mode==='svc'?'on':'')+'" data-step-set="0" aria-selected="'+(mode==='svc')+'">1 · Our system</button><button type="button" role="tab" class="'+(mode==='status'?'on':'')+'" data-step-set="1" aria-selected="'+(mode==='status')+'">2 · Your results</button></div>'+(mode==='status'?'<div class="chips"><span class="pill p-f">'+cnt.f+' failed</span><span class="pill p-w">'+cnt.w+' need work</span><span class="pill p-p">'+cnt.p+' passed</span></div>':'<div class="hint">Next: see how you did on each →</div>')+'</div></div>'+
 '<div class="hub"><div class="card" style="display:grid;place-items:center;padding:.4cqw">'+wheel(mode,hubSel)+'</div>'+hubCard(hubSel,mode)+'</div></div></div>'}
STAGE.addEventListener('click',e=>{if(cur!=='checks')return;const n=e.target.closest('.nd'),t=e.target.closest('[data-step-set]'),b=e.target.closest('.tbtn');
 if(n){hubSel=+n.dataset.i;render();const f=STAGE.querySelector('.nd[data-i="'+hubSel+'"]');f&&f.focus()}else if(t){step=+t.dataset.stepSet;render()}else if(b){hubSel=(hubSel+ +b.dataset.d+11)%11;render()}});
STAGE.addEventListener('keydown',e=>{const n=e.target.closest('.nd');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();hubSel=+n.dataset.i;render();STAGE.querySelector('.nd[data-i="'+hubSel+'"]').focus()}});

function chart(c){const v=c.real?c.v:[c.a,c.a,c.b],s0=c.real?c.s0:1,W=300,H=120,mx=Math.max(...v)*1.12,x=i=>8+i*(W-16)/(v.length-1),y=n=>H-16-n/mx*(H-30);
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Monthly visits before and after we started"><rect class="ar" x="'+x(s0)+'" y="10" width="'+(x(v.length-1)-x(s0))+'" height="'+(H-26)+'" fill="#E3F3EC" opacity=".7"/><line x1="'+x(s0)+'" x2="'+x(s0)+'" y1="6" y2="'+(H-16)+'" stroke="#FF5A3C" stroke-width="1.6" stroke-dasharray="3 3"/><text x="'+(x(s0)+4)+'" y="18" font-size="10" font-weight="700" fill="#FF5A3C" font-family="Hanken Grotesk,sans-serif">We started</text>'+
 '<path d="'+v.slice(0,s0+1).map((n,i)=>(i?'L':'M')+x(i)+' '+y(n)).join(' ')+'" fill="none" stroke="#AEB5BF" stroke-width="2.4"/><path d="'+v.slice(s0).map((n,i)=>(i?'L':'M')+x(i+s0)+' '+y(n)).join(' ')+'" fill="none" stroke="#0E8A5F" stroke-width="3"/><circle cx="'+x(v.length-1)+'" cy="'+y(v[v.length-1])+'" r="4" fill="#0E8A5F"/>'+
 '<text x="8" y="'+(H-2)+'" font-size="10" fill="#6E7887" font-family="Hanken Grotesk,sans-serif">Before: '+fmt(v[0])+'/mo</text><text x="'+(W-8)+'" y="'+(H-2)+'" text-anchor="end" font-size="10" font-weight="700" fill="#0E8A5F" font-family="Hanken Grotesk,sans-serif">Now: '+fmt(v[v.length-1])+'/mo</text></svg>'}
function vWhy(){const svc=(B.svc||'')+' '+(B.full||'');let cards=CARDS.slice();const mi=cards.findIndex(c=>c.k.test(svc));let match=-1;if(mi>=0){const [m]=cards.splice(mi,1);cards.unshift(m);match=0}
 STAGE.innerHTML='<div class="scr">'+top()+'<div class="body"><div class="ttl">Businesses like yours, <em>after we started.</em></div><div class="trackw"><div class="arrows"><button type="button" data-sc="-1" aria-label="Scroll results left">←</button><button type="button" data-sc="1" aria-label="Scroll results right">→</button></div><div class="track" tabindex="0" aria-label="Client results">'+
 cards.map((c,i)=>{const up=Math.round((c.ai[1]/c.ai[0]-1)*100);return '<div class="card'+(i===match?' match':'')+'">'+(i===match?'<span class="badge">Most like you</span>':'')+'<div class="typ">'+c.typ+'</div><div class="loc">'+c.loc+'</div><div class="rowx" style="justify-content:space-between"><span class="up">+'+up+'% <small style="font-size:1cqw;font-weight:700;opacity:.75">AI score</small></span><span class="hint">'+c.ai[0]+' → '+c.ai[1]+'</span></div>'+chart(c)+'<span class="hint" style="font-size:.9cqw">'+(c.real?'Monthly visits from search and AI':'Illustrative: start and end visits only')+'</span></div>'}).join('')+
 '</div></div><div class="card" style="padding:1.1cqw 1.6cqw"><div class="facesrow"><div class="stack2">'+FACES.map(f=>'<img src="'+f.f+'" alt="'+X(f.n)+'">').join('')+'</div><div style="font-size:1.15cqw"><b style="font-family:var(--fu)">'+FACES.slice(1,4).map(f=>X(f.n)).join(', ')+'</b> and 100+ practices and industry leaders vouch for us</div></div></div>'+
 '<div class="rowx" style="justify-content:space-between;font-size:1.05cqw;color:var(--muted)"><span><b style="color:var(--ink)">As seen in</b>&nbsp; '+PRESS.slice(0,5).join(' · ')+'</span><span>$750K insured · HIPAA BAA · US-based team</span></div></div></div>'}
STAGE.addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(!b)return;const t=STAGE.querySelector('.track');t.scrollBy({left:+b.dataset.sc*t.clientWidth*.66,behavior:RM?'auto':'smooth'})});

 '<div class="card pad col old"><span class="lbl">The old way: 9 vendors to hire and manage</span><div class="oldp"><s>$14,250</s><small> /mo</small></div><div class="vl">'+V.map(r=>'<div><span>'+r[0]+'</span><b>$'+fmt(r[1])+'</b></div>').join('')+'</div><div style="margin-top:auto;font:600 1.15cqw/1.4 var(--fb);color:var(--muted)">9 contracts, 9 teams, each working on its own piece of your business.</div></div>'+
 '<div class="vsx">vs</div><div class="card col new"><div class="nhead"><div><div class="newp">$5,000<small> /mo</small></div><div class="lbl">One team. One record. All 11 checks.</div></div><div class="rec">'+LOGO+'</div></div>'+
 '<ul class="t4"><li><b>Guaranteed.</b> In AI answers by day 90, or we stop billing and keep working.</li><li><b>Area exclusivity.</b> Nobody like you within 15 miles.</li><li><b>Grandfathered.</b> Keep this price as long as you stay.</li><li><b>Month to month.</b> Cancel anytime.</li></ul>'+
 '<div class="rowx" style="margin-top:auto;justify-content:space-between"><a class="btn2" href="https://localairegistry.com" target="_blank" rel="noopener">Get started →</a><span style="font-size:1cqw;color:var(--blue3)">Multiple locations? Ask about pricing.</span></div></div></div>'+
 '<div class="card tl12"><div class="tlh"><b>Your first 12 months</b><span class="g90"><i></i>In AI answers by day 90, guaranteed</span><span style="margin-left:auto">Every item waits for your approval</span></div><div class="tlr">'+PHS.map(p=>'<div><span class="m">'+p[0]+'</span><b>'+p[1]+'</b><span class="d">'+p[2]+'</span></div>').join('')+'<i class="g90m" title="Day 90"></i></div></div></div></div>'}

 STAGE.querySelectorAll('.chap button').forEach(b=>b.disabled=!D)}
