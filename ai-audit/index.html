<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>AI Visibility Audit · Local AI Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Cormorant:wght@500;600&display=swap">
<style>

/* Layout: full-window stage. Every size is a multiple of --u (1% of the width, capped by the height), so the screen fills any desktop window. Below 760px it becomes one scrolling column.
   Single light look on purpose: the white Local AI Registry brand. */
:root{
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#0B1A2E; --body:#2C3A4F; --muted:#6E7887; --rule:rgba(11,26,46,.12);
  --blue:#1F4FE0; --blue2:#6F8FEF; --blue3:#B3C3F5; --blue-t:#E7EDFC; --coral:#FF5A3C; --peach:#F5DEC6;
  --red:#D7261B; --red-t:#FDECEA; --ok:#0E8A5F; --ok-t:#E3F3EC; --amber:#B5822A; --amber-t:#F8EFDC; --grey:#AEB5BF;
  --fu:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif; --fb:"Hanken Grotesk",system-ui,sans-serif; --fd:"Cormorant",Georgia,serif;
  --shadow:0 1px 2px rgba(11,26,46,.05),0 6px 20px rgba(11,26,46,.06);
  color-scheme:light;
}

/* ===== 16:9 screen ===== */
.frame{container-type:inline-size;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 18px 50px rgba(11,26,46,.12);position:relative;font-family:var(--fb);color:var(--ink)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:calc(2.2*var(--u));padding:calc(1.4*var(--u)) calc(2.4*var(--u));font-size:calc(1.15*var(--u))}
.lg{display:flex;align-items:center;gap:calc(.6*var(--u));font:700 calc(1.3*var(--u)) var(--fu);white-space:nowrap}
.lg svg{width:calc(1.4*var(--u));height:calc(1.4*var(--u))}
.chap{display:flex;align-items:center;gap:calc(.15*var(--u));margin:0 auto;background:var(--card);border-radius:calc(99*var(--u));padding:calc(.35*var(--u));box-shadow:0 0 0 1px rgba(11,26,46,.06),0 calc(.4*var(--u)) calc(1.4*var(--u)) rgba(11,26,46,.08)}
.chap button{position:relative;display:flex;align-items:center;gap:calc(.55*var(--u));padding:calc(.42*var(--u)) calc(.95*var(--u)) calc(.42*var(--u)) calc(.42*var(--u));border-radius:calc(99*var(--u));color:var(--muted);font:600 calc(.98*var(--u)) var(--fb);white-space:nowrap;transition:background .3s,color .3s}
.chap button i{flex:none;width:calc(1.65*var(--u));height:calc(1.65*var(--u));border-radius:50%;display:grid;place-items:center;font:800 calc(.78*var(--u))/1 var(--fu);font-style:normal;background:var(--bg);color:var(--muted);transition:all .3s}
.chap button+span::before{content:"";position:absolute;left:calc(-.25*var(--u));top:50%;width:calc(.35*var(--u));height:1px;background:var(--rule)}
.chap button.done{color:var(--ink)}
.chap button.done i{background:var(--ok-t);color:var(--ok)}
.chap button.on{background:var(--ink);color:#fff;box-shadow:0 calc(.3*var(--u)) calc(1*var(--u)) rgba(11,26,46,.28)}
.chap button.on i{background:#fff;color:var(--blue)}
.chap button.on::before,.chap button.on+span::before{display:none}
.pg{display:flex;align-items:center;gap:calc(.6*var(--u));color:var(--muted);font-weight:600;white-space:nowrap}
.pg i{font-style:normal;width:calc(2.4*var(--u));height:calc(2.4*var(--u));display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.prog{height:calc(.25*var(--u));background:var(--rule);margin:0 calc(2.4*var(--u))}
.prog i{display:block;height:100%;background:var(--blue);border-radius:calc(9*var(--u))}
.body{flex:1;padding:calc(1.8*var(--u)) calc(2.4*var(--u)) calc(2.2*var(--u));display:flex;flex-direction:column;gap:calc(1.3*var(--u));min-height:0}
.kick{font:700 calc(1*var(--u)) var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ttl{font:800 calc(2.7*var(--u))/1.08 var(--fu);letter-spacing:-.02em}
.ttl em{font-style:normal;color:var(--blue)}
.sub{font-size:calc(1.35*var(--u));line-height:1.4;color:var(--body)}
.card{background:var(--card);border-radius:calc(1.2*var(--u));box-shadow:var(--shadow);min-width:0;min-height:0}
.pad{padding:calc(1.7*var(--u))}
.col{display:flex;flex-direction:column;gap:calc(1*var(--u))}
.lbl{font:600 calc(1.1*var(--u)) var(--fb);color:var(--muted)}
.hint{font-size:calc(1.05*var(--u));color:var(--muted)}
.more{margin-top:auto;font:700 calc(1.1*var(--u)) var(--fb);color:var(--blue)}
.pill{display:inline-block;font:700 calc(.95*var(--u))/1 var(--fb);padding:calc(.45*var(--u)) calc(.8*var(--u));border-radius:calc(99*var(--u));white-space:nowrap}
.p-f{background:var(--red-t);color:var(--red)} .p-w{background:var(--amber-t);color:var(--amber)} .p-p{background:var(--ok-t);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(.6*var(--u));background:var(--coral);color:#fff;font:700 calc(1.25*var(--u)) var(--fb);padding:calc(1.05*var(--u)) calc(1.8*var(--u));border-radius:calc(99*var(--u));white-space:nowrap;border:0}
.big{font:800 calc(7*var(--u))/1 var(--fu);letter-spacing:-.03em}
.big small{font-size:calc(1.7*var(--u));color:var(--muted);font-weight:700;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:calc(1.3*var(--u));flex:1;min-height:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1.3*var(--u));flex:1;min-height:0}
.rowx{display:flex;align-items:center;gap:calc(1*var(--u))}
.num{font-variant-numeric:tabular-nums}

/* range slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:calc(.8*var(--u));border-radius:calc(9*var(--u));background:linear-gradient(90deg,var(--ok) var(--p,20%),var(--ok-t) var(--p,20%));outline:none;cursor:pointer;margin:0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:calc(2.2*var(--u));height:calc(2.2*var(--u));border-radius:50%;background:#fff;border:calc(.3*var(--u)) solid var(--ok);box-shadow:var(--shadow)}
.rng::-moz-range-thumb{width:calc(1.8*var(--u));height:calc(1.8*var(--u));border-radius:50%;background:#fff;border:calc(.3*var(--u)) solid var(--ok)}
.rng:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.sl{display:flex;justify-content:space-between;font:600 calc(1*var(--u)) var(--fb);color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:calc(.9*var(--u))}
.bars>div{display:grid;grid-template-columns:calc(12*var(--u)) 1fr calc(5.5*var(--u));gap:calc(1*var(--u));align-items:center;font-size:calc(1.15*var(--u))}
.bars u{display:block;height:calc(1.4*var(--u));border-radius:calc(9*var(--u));background:var(--bg);text-decoration:none;position:relative;overflow:hidden}
.bars u i{position:absolute;inset:0 auto 0 0;background:var(--blue3);border-radius:calc(9*var(--u));transition:width .5s}
.bars>div.me{font-weight:800}
.bars>div.me u i{background:var(--blue)}
.bars>div.me.bad u i{background:var(--coral)}
.bars b{text-align:right;font-family:var(--fu);font-variant-numeric:tabular-nums}

/* AI engine chips */
.eng{display:flex;gap:calc(.35*var(--u))}
.eng i{width:calc(1.75*var(--u));height:calc(1.75*var(--u));border-radius:50%;display:grid;place-items:center;font:800 calc(.72*var(--u)) var(--fb);font-style:normal;color:#fff}
.eng i.off{background:var(--bg)!important;color:var(--grey);box-shadow:inset 0 0 0 1px var(--rule)}

/* ---------- front page + loaders ---------- */
.home{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,#F1E3C4,#E2CFA8 60%,#CDB78F);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2*var(--u))}
.scard{background:#FFFDF9;border-radius:calc(2.4*var(--u));padding:calc(2.4*var(--u)) calc(3*var(--u));width:calc(42*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--u));box-shadow:0 calc(2*var(--u)) calc(5*var(--u)) rgba(60,40,10,.18)}
.scard h4{margin:0;font:800 calc(3.3*var(--u))/1.05 var(--fu);letter-spacing:-.03em;text-align:center}
.scard h4 em{font-style:normal;color:var(--blue)}
.sbox{width:100%;display:flex;align-items:center;gap:calc(1*var(--u));border:1px solid var(--rule);border-radius:calc(99*var(--u));padding:calc(1.2*var(--u)) calc(1.6*var(--u));font-size:calc(1.3*var(--u));color:var(--muted);background:#fff}
.sbox b{color:var(--ink);font-weight:600}
.caret{display:inline-block;width:calc(.15*var(--u));height:calc(1.5*var(--u));background:var(--ink);margin-left:calc(.1*var(--u));animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.seen{display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--u))}
.seen .lbl{color:#6b5a3c;letter-spacing:.1em;text-transform:uppercase;font-size:calc(.95*var(--u));font-weight:700}
.logos{display:flex;gap:calc(3*var(--u));align-items:center;font:800 calc(1.7*var(--u)) var(--fu);color:rgba(11,26,46,.55);flex-wrap:wrap;justify-content:center}
.logos span:nth-child(2){font-family:var(--fd);font-size:calc(2.1*var(--u))}
.trust{display:flex;gap:calc(1.6*var(--u));font-size:calc(1.1*var(--u));color:#5b4a2c}
.trust b{color:var(--ink)}

.ld{position:absolute;inset:0;display:grid;grid-template-columns:calc(30*var(--u)) 1fr;background:var(--bg)}
.ldp{background:var(--card);padding:calc(2.4*var(--u));display:flex;flex-direction:column;gap:calc(1.2*var(--u));box-shadow:1px 0 0 var(--rule)}
.ldp .who{font:800 calc(2.2*var(--u))/1.1 var(--fu)}
.ldp .st{display:flex;flex-direction:column;gap:calc(.7*var(--u));font-size:calc(1.15*var(--u));color:var(--muted)}
.ldp .st div{display:flex;gap:calc(.8*var(--u));align-items:center}
.ldp .st div i{width:calc(1.5*var(--u));height:calc(1.5*var(--u));border-radius:50%;box-shadow:inset 0 0 0 calc(.2*var(--u)) var(--rule);flex:none;display:grid;place-items:center;font-style:normal;font-size:calc(.9*var(--u));color:#fff}
.ldp .st div.d{color:var(--ink)} .ldp .st div.d i{background:var(--ok);box-shadow:none}
.ldp .st div.n{color:var(--ink);font-weight:700} .ldp .st div.n i{box-shadow:inset 0 0 0 calc(.25*var(--u)) var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 calc(.25*var(--u)) var(--blue3)}}
.pct{margin-top:auto;display:flex;flex-direction:column;gap:calc(.7*var(--u))}
.pct b{font:800 calc(3.6*var(--u))/1 var(--fu)}
.pbar{height:calc(.8*var(--u));border-radius:calc(9*var(--u));background:var(--bg);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:calc(9*var(--u));transition:width .4s}
.ldm{position:relative;padding:calc(2.4*var(--u));display:flex;flex-direction:column;gap:calc(1.2*var(--u));min-width:0;overflow:hidden}

/* L1 chat */
.chat{flex:1;display:flex;flex-direction:column;gap:calc(1.2*var(--u));min-height:0}
.etabs{display:flex;gap:calc(.6*var(--u))}
.etabs span{display:flex;align-items:center;gap:calc(.5*var(--u));padding:calc(.6*var(--u)) calc(1*var(--u));border-radius:calc(99*var(--u));font:700 calc(1.05*var(--u)) var(--fb);color:var(--muted);background:var(--card);box-shadow:var(--shadow);transition:all .3s}
.etabs span.on{background:var(--ink);color:#fff}
.bub{max-width:80%;padding:calc(1.2*var(--u)) calc(1.5*var(--u));border-radius:calc(1.4*var(--u));font-size:calc(1.4*var(--u));line-height:1.4}
.bub.q{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:calc(.3*var(--u))}
.bub.a{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:calc(.3*var(--u));display:flex;flex-direction:column;gap:calc(.6*var(--u));min-width:calc(44*var(--u))}
.bub.a .ln{display:flex;align-items:center;gap:calc(.8*var(--u));opacity:0;transform:translateY(calc(.5*var(--u)));transition:all .4s}
.bub.a .ln.in{opacity:1;transform:none}
.bub.a .ln b{font-family:var(--fu)}
.bub.a .ln.you{background:var(--ok-t);margin:0 calc(-.6*var(--u));padding:calc(.3*var(--u)) calc(.6*var(--u));border-radius:calc(.6*var(--u))}
.verdict{align-self:flex-start;font:800 calc(1.3*var(--u)) var(--fu);padding:calc(.8*var(--u)) calc(1.3*var(--u));border-radius:calc(99*var(--u));opacity:0;transition:opacity .4s}
.verdict.in{opacity:1}
.verdict.y{background:var(--ok-t);color:var(--ok)} .verdict.n{background:var(--red-t);color:var(--red)}
.tally{display:flex;gap:calc(.6*var(--u));align-items:center;font-size:calc(1.1*var(--u));color:var(--muted)}

/* L3 map */
.map{position:absolute;inset:0;background:#EEF0EC}
.map svg.streets{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;left:58%;top:52%;width:calc(70*var(--u));height:calc(70*var(--u));transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,rgba(31,79,224,.22),rgba(31,79,224,0) 22%);animation:rot 4s linear infinite}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ring{position:absolute;left:58%;top:52%;border-radius:50%;border:1px solid rgba(31,79,224,.25);transform:translate(-50%,-50%)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .4s,transform .4s}
.pin.in{opacity:1}
.pin span{background:var(--card);box-shadow:var(--shadow);border-radius:calc(.8*var(--u));padding:calc(.5*var(--u)) calc(.8*var(--u));font:700 calc(1*var(--u)) var(--fb);white-space:nowrap}
.pin span small{color:var(--muted);font-weight:600}
.pin i{width:calc(1.2*var(--u));height:calc(1.2*var(--u));border-radius:50%;background:var(--blue2);border:calc(.25*var(--u)) solid #fff;margin-top:calc(.3*var(--u));box-shadow:var(--shadow)}
.pin.me span{background:var(--ink);color:#fff}.pin.me span small{color:var(--blue3)}
.pin.me i{background:var(--coral);width:calc(1.6*var(--u));height:calc(1.6*var(--u))}
.qb{position:absolute;background:var(--blue);color:#fff;font:600 calc(1*var(--u)) var(--fb);padding:calc(.5*var(--u)) calc(.9*var(--u));border-radius:calc(1*var(--u)) calc(1*var(--u)) calc(1*var(--u)) calc(.2*var(--u));white-space:nowrap;opacity:0;transition:opacity .5s}
.qb.in{opacity:1}
.dotp{position:absolute;width:calc(.8*var(--u));height:calc(.8*var(--u));border-radius:50%;background:var(--blue2);opacity:.6}

/* L4 reel */
.reel{flex:1;position:relative}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:calc(1.4*var(--u));opacity:0;transform:translateY(calc(1*var(--u)));transition:all .6s}
.rc.on{opacity:1;transform:none}
.rc .src{font:800 calc(2*var(--u)) var(--fu);color:var(--muted)}
.rc h5{margin:0;font:800 calc(3*var(--u))/1.12 var(--fu);letter-spacing:-.02em;max-width:calc(52*var(--u))}
.rc .bigg{font:800 calc(9*var(--u))/1 var(--fu);color:var(--ok);letter-spacing:-.03em}
.face{display:flex;align-items:center;gap:calc(1.2*var(--u))}
.face img{width:calc(6*var(--u));height:calc(6*var(--u));border-radius:50%;object-fit:cover}
.face b{display:block;font:800 calc(1.8*var(--u)) var(--fu)}
.face span{font-size:calc(1.25*var(--u));color:var(--muted)}

/* ---------- snapshot ---------- */
.gauge text{font-family:var(--fb)}
.race{display:flex;flex-direction:column;gap:calc(.5*var(--u))}
.race>div{display:grid;grid-template-columns:calc(2.4*var(--u)) calc(15*var(--u)) 1fr 1fr 1fr;gap:calc(1*var(--u));align-items:center;padding:calc(.9*var(--u)) calc(1.1*var(--u));border-radius:calc(1*var(--u));font-size:calc(1.25*var(--u))}
.race>div.h{font:700 calc(.95*var(--u)) var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:calc(.2*var(--u))}
.race>div.me{background:var(--ink);color:#fff}
.race>div.me small{color:var(--blue3)}
.race b{font:800 calc(1.5*var(--u)) var(--fu)}
.race .rk{font:800 calc(1.3*var(--u)) var(--fu);color:var(--muted)}
.race>div.me .rk{color:var(--coral)}
.race small{display:block;font-size:calc(.95*var(--u));color:var(--muted)}
.minib{height:calc(.7*var(--u));border-radius:calc(9*var(--u));background:var(--bg);margin-top:calc(.4*var(--u));overflow:hidden}
.minib i{display:block;height:100%;background:var(--blue3)}
.race>div.me .minib{background:rgba(255,255,255,.15)}.race>div.me .minib i{background:var(--coral)}
.funnel{flex:1;display:grid;grid-template-columns:1fr calc(3*var(--u)) 1fr calc(3*var(--u)) 1.15fr;align-items:stretch;min-height:0}
.arrow{display:grid;place-items:center;font:800 calc(2.4*var(--u)) var(--fu);color:var(--blue3)}
.fstep{padding:calc(1.8*var(--u));display:flex;flex-direction:column;gap:calc(.9*var(--u))}
.fstep .k{font:800 calc(1.05*var(--u)) var(--fu);color:var(--blue)}
.people{display:grid;grid-template-columns:repeat(10,1fr);gap:calc(.45*var(--u));margin-top:calc(.4*var(--u))}
.people i{aspect-ratio:1;border-radius:50%;background:var(--blue3)}
.people i.y{background:var(--ok)}
.ring2 text{font-family:var(--fu)}

/* ---------- benchmarks ---------- */
.prow{display:grid;grid-template-columns:1fr auto calc(5*var(--u));gap:calc(1*var(--u));align-items:center;padding:calc(.85*var(--u)) 0;border-bottom:1px solid var(--rule);font-size:calc(1.25*var(--u))}
.prow b{font-family:var(--fu);text-align:right;font-variant-numeric:tabular-nums}
.prow small{display:block;font-size:calc(.95*var(--u));color:var(--muted)}
.ph{display:flex;align-items:center;gap:calc(.8*var(--u));font:800 calc(1.5*var(--u)) var(--fu)}
.ph i{width:calc(1.2*var(--u));height:calc(1.2*var(--u));border-radius:50%}
.lc text{font-family:var(--fb)}

/* ---------- hub ---------- */
.hub{flex:1;display:grid;grid-template-columns:1.12fr 1fr;gap:calc(1.3*var(--u));min-height:0}
.fw{width:100%;height:100%;display:block}
.fw .nd{cursor:pointer}
.fw .nd:focus{outline:none}
.fw .nd:focus-visible circle.c{stroke-width:5}
@keyframes dash{to{stroke-dashoffset:-60}}
.flowline{animation:dash 3s linear infinite}
.tabs{display:flex;background:var(--bg);border-radius:calc(99*var(--u));padding:calc(.35*var(--u));gap:calc(.3*var(--u));align-self:flex-start}
.tabs button{all:unset;cursor:pointer;padding:calc(.6*var(--u)) calc(1.3*var(--u));border-radius:calc(99*var(--u));font:700 calc(1.05*var(--u)) var(--fb);color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--blue)}
.dt{padding:calc(1.8*var(--u));display:flex;flex-direction:column;gap:calc(1.05*var(--u));overflow:hidden}
.dt .hero{display:flex;align-items:flex-end;gap:calc(1.4*var(--u))}
.dt .hero .big{font-size:calc(6.2*var(--u))}
.dt .hero .cap{font:600 calc(1.35*var(--u))/1.3 var(--fb);color:var(--body);padding-bottom:calc(.6*var(--u));max-width:calc(22*var(--u))}
.dt .say{font:700 calc(1.6*var(--u))/1.3 var(--fu);color:var(--ink)}

 '</div></div><div class="card" style="padding:calc(1.1*var(--u)) calc(1.6*var(--u))"><div class="facesrow"><div class="stack2">'+FACES.map(f=>'<img src="'+f.f+'" alt="'+X(f.n)+'">').join('')+'</div><div style="font-size:calc(1.15*var(--u))"><b style="font-family:var(--fu)">'+FACES.slice(1,4).map(f=>X(f.n)).join(', ')+'</b> and 100+ practices and industry leaders vouch for us</div></div></div>'+
 '<div class="rowx" style="justify-content:space-between;font-size:calc(1.05*var(--u));color:var(--muted)"><span><b style="color:var(--ink)">As seen in</b>&nbsp; '+PRESS.slice(0,5).join(' · ')+'</span><span>$750K insured · HIPAA BAA · US-based team</span></div></div></div>'}

 '<div class="vsx">vs</div><div class="card col new"><div class="nhead"><div><div class="newp"><s data-was hidden>$5,000</s><span data-price>$5,000</span><small> /mo</small></div><div class="lbl">One team. One record. All 11 checks.</div><div class="cdn" hidden></div></div><div class="rec">'+LOGO+'</div></div>'+

 '<div class="rowx" style="margin-top:auto;justify-content:space-between"><button type="button" class="btn2" data-ckx="open">Get started →</button><span style="font-size:calc(1*var(--u));color:var(--blue3)">Multiple locations? Ask about pricing.</span></div></div></div>'+
 '<div class="card tl12"><div class="tlh"><b>Your first 12 months</b><span class="g90"><i></i>In AI answers by day 90, guaranteed</span><span style="margin-left:auto">Every item waits for your approval</span></div><div class="tlr">'+PHS.map(p=>'<div><span class="m">'+p[0]+'</span><b>'+p[1]+'</b><span class="d">'+p[2]+'</span></div>').join('')+'<i class="g90m" title="Day 90"></i></div></div></div></div>'+ckHTML()}

/* ---------- live map behind home and scan (map-light.html: real streets, roaming people) ---------- */
const MAPBG=document.getElementById('mapbg');let mapWin=null,mapLive=false,mapFocused=null;
const QUIET='#ldr,#fx,.fxbar,#fxtop,#fxback,#fxctl,.fxctl,#fxkey,#fxkeyb,#fxcart,#fxnote,.fxdock,.nightbadge,#nightbadge,#mvveil,.mvcap,.mvb,.iv-skip,#poster{display:none!important}.paper{opacity:.25!important}';
const GKEY='AIzaSyAM_oWtpPy_P8I__Os1wxe9Koyd2Ma30k4';
async function nearby(loc,qtext,self){try{const j=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'places.id,places.displayName,places.location,places.rating,places.userRatingCount'},body:JSON.stringify({textQuery:qtext,maxResultCount:10,locationBias:{circle:{center:{latitude:loc[1],longitude:loc[0]},radius:8000}}})}).then(x=>x.json());
 const sn=String(self||'').toLowerCase().replace(/[^a-z]/g,'').slice(0,10);return (j.places||[]).filter(p=>p.location&&!(sn&&(p.displayName.text||'').toLowerCase().replace(/[^a-z]/g,'').startsWith(sn))).map(p=>({name:p.displayName.text,loc:[p.location.longitude,p.location.latitude],rt:p.rating||null,n:p.userRatingCount||0}))}catch(e){return []}}
function mapEnsure(){if(MAPBG.firstChild)return;const f=document.createElement('iframe');f.src='map-light.html?v=1';f.title='Map';f.tabIndex=-1;f.setAttribute('aria-hidden','true');MAPBG.appendChild(f);
 f.addEventListener('load',()=>{try{const d=f.contentDocument,st=d.createElement('style');st.textContent=QUIET;d.head.appendChild(st);mapWin=f.contentWindow}catch(e){return}
  let n=0;(function chk(){try{const L=mapWin.LAIR,m=L&&L.map;if(m&&L.focus&&m.loaded()&&m.isStyleLoaded()){mapLive=true;document.body.classList.add('maplive');if(cur==='scan')mapFocus();return}}catch(e){}if(n++<50)setTimeout(chk,300)})()})}
function mapPad(){const mob=MOB();if(mob){const sp=STAGE.querySelector('.sp');return {top:150,bottom:(sp?sp.offsetHeight:260)+40,left:0,right:0}}const sp=STAGE.querySelector('.sp');return {top:90,bottom:60,left:(sp?sp.getBoundingClientRect().right:0)+30,right:30}}
function mapTrack(){const L=mapWin&&mapWin.LAIR;if(!L||!L.map||!L.mk||L.__tracked)return;L.__tracked=1;
 const place=()=>{try{const p=L.map.project(L.mk.getLngLat());STAGE.style.setProperty('--rx',p.x+'px');STAGE.style.setProperty('--ry',p.y+'px');document.body.classList.add('maptracked')}catch(e){}};L.map.on('render',place);place()}
async function mapFocus(){if(!mapLive||!D||mapFocused===SLUG)return;mapFocused=SLUG;const H=D.hit;if(!H||!H.loc)return;
 try{mapWin.LAIR.pad=mapPad()}catch(e){}
 const cs=await nearby(H.loc,H.cq||B.svc||'',H.name);if(mapFocused!==SLUG)return;
 const post=o=>{try{mapWin.postMessage(o,'*')}catch(e){}};
 post({t:'focus',name:H.short,rt:H.rt,n:H.n,area:H.area,loc:H.loc,hours:H.hours,comps:cs,qs:H.qs});post({t:'audit',steps:[['Scanning',PH.length*5+2]]});
 setTimeout(mapTrack,200)}

/* ---------- checkout (card form and promo code; card details never leave the page) ---------- */
const PROMOS={KODY25:{off:.25,label:'25% off your monthly price',ends:Date.parse('2026-12-01T07:59:00Z'),endsLabel:'Dec 1'}};
let promo=null,cdTimer=0;
const planPrice=()=>promo?Math.round(5000*(1-promo.off)):5000;
function ckHTML(){return '<div class="ckx" id="ckx" hidden role="dialog" aria-modal="true" aria-labelledby="ckt"><div class="ckx-bg" data-ckx="close"></div><form class="ckx-card" id="ckf" novalidate autocomplete="on">'+
 '<div class="ckh"><div><div class="kick">'+X(ME)+' × Local AI Registry</div><h2 id="ckt">Start your plan</h2></div><button type="button" class="ib x" data-ckx="close" aria-label="Close">✕</button></div>'+
 '<div class="cksum"><span>One team, one record, all 11 checks<small>Month to month · cancel anytime</small></span><b><s id="ck-was" hidden>$5,000</s> <span id="ck-price">$'+fmt(planPrice())+'</span><small>/mo</small></b></div>'+
 '<div class="cdn" id="ck-cd" hidden></div>'+
 '<label class="fl"><span>Name on card</span><input id="ccname" autocomplete="cc-name" required></label>'+
 '<label class="fl"><span>Card number</span><input id="ccn" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="1234 1234 1234 1234" required></label>'+
 '<div class="fl3"><label class="fl"><span>Expires</span><input id="cce" inputmode="numeric" autocomplete="cc-exp" maxlength="7" placeholder="MM / YY" required></label><label class="fl"><span>CVC</span><input id="ccv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123" required></label><label class="fl"><span>ZIP</span><input id="ccz" inputmode="numeric" autocomplete="postal-code" maxlength="10" placeholder="12345" required></label></div>'+
 '<div class="promo"><button type="button" class="plink" id="pc-open">Have a promo code?</button><div class="prow" id="pc-row" hidden><input id="ccp" autocomplete="off" placeholder="Promo code" aria-label="Promo code"><button type="button" class="pbtn" id="pc-apply">Apply</button></div><p class="ckm" id="pc-msg" role="status"></p></div>'+
 '<button class="btn ckgo" type="submit" id="ck-go">Start plan · $'+fmt(planPrice())+'/mo →</button><p class="ckm" id="ck-msg" role="status"></p>'+
 '<p class="ckfine">Guaranteed: in AI answers by day 90, or we stop billing and keep working.</p></form></div>'}
function ckWire(){const g=id=>document.getElementById(id),box=g('ckx');if(!box)return;
 const open=()=>{box.hidden=false;requestAnimationFrame(()=>box.classList.add('on'));setTimeout(()=>g('ccname').focus(),150)},close=()=>{box.classList.remove('on');setTimeout(()=>{box.hidden=true},250)};
 STAGE.querySelectorAll('[data-ckx="open"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();open()}));
 box.addEventListener('click',e=>{if(e.target.closest('[data-ckx="close"]'))close()});box.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close()}});
 g('ccn').addEventListener('input',e=>{const d=e.target.value.replace(/\D/g,'').slice(0,16);e.target.value=d.replace(/(\d{4})(?=\d)/g,'$1 ')});
 g('cce').addEventListener('input',e=>{const d=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=d.length>2?d.slice(0,2)+' / '+d.slice(2):d});
 ['ccv','ccz'].forEach(id=>g(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')}));
 g('pc-open').addEventListener('click',()=>{g('pc-row').hidden=false;g('pc-open').hidden=true;g('ccp').focus()});
 const apply=()=>{const c=g('ccp').value.trim().toUpperCase(),m=g('pc-msg');if(!c){m.textContent='';return}const P=PROMOS[c];
  if(!P||Date.now()>P.ends){m.textContent='That code isn\'t valid.';m.className='ckm er';return}
  promo=Object.assign({code:c},P);m.textContent=c+' applied: '+P.label+'.';m.className='ckm ok';g('ccp').disabled=true;g('pc-apply').disabled=true;priceUI()};
 g('pc-apply').addEventListener('click',apply);g('ccp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();apply()}});
 g('ckf').addEventListener('submit',e=>{e.preventDefault();const m=g('ck-msg');const ok=g('ccname').value.trim().length>1&&g('ccn').value.replace(/\s/g,'').length>=15&&/^\d\d \/ \d\d$/.test(g('cce').value)&&g('ccv').value.length>=3&&g('ccz').value.length>=5;
  if(!ok){m.textContent='Please fill in all your card details.';m.className='ckm er';return}
  m.innerHTML='<b>Thank you.</b> Card checkout isn\'t live yet, so nothing was charged. We\'ll reach out to finish setting up your plan.';m.className='ckm ok';g('ck-go').disabled=true});
 priceUI()}
function priceUI(){const g=id=>document.getElementById(id),pr=planPrice();
 STAGE.querySelectorAll('[data-price]').forEach(e=>e.textContent='$'+fmt(pr));STAGE.querySelectorAll('[data-was]').forEach(e=>e.hidden=!promo);STAGE.querySelectorAll('[data-save]').forEach(e=>e.textContent='$'+fmt(14250-pr));
 const cp=g('ck-price');if(cp){cp.textContent='$'+fmt(pr);g('ck-was').hidden=!promo;g('ck-go').textContent='Start plan · $'+fmt(pr)+'/mo →'}
 const tick=()=>{const z=promo?Math.max(0,Math.floor((promo.ends-Date.now())/1000)):0,t=promo?'<b>'+Math.round(promo.off*100)+'% off</b> ends '+promo.endsLabel+', then $5,000/mo · <span class="num">'+Math.floor(z/86400)+'d '+String(Math.floor(z%86400/3600)).padStart(2,'0')+'h '+String(Math.floor(z%3600/60)).padStart(2,'0')+'m '+String(z%60).padStart(2,'0')+'s</span>':'';
  STAGE.querySelectorAll('.cdn').forEach(e=>{e.hidden=!promo;e.innerHTML=t})};
 clearInterval(cdTimer);tick();if(promo)cdTimer=setInterval(()=>{if(cur!=='plan'){clearInterval(cdTimer);return}tick()},1000)}

/* ---------- render ---------- */
function render(){STAGE.onclick=null;if(cur!=='scan')clearInterval(scanTimer);const mo=cur==='find'||cur==='scan';document.body.classList.toggle('mapon',mo);if(mo)mapEnsure();({find:vFind,scan:vScan,score:vScore,ask:vAsk,checks:vChecks,why:vWhy,plan:vPlan})[cur]();if(cur==='scan')mapFocus();if(cur==='plan')ckWire();
 STAGE.querySelectorAll('.chap button').forEach(b=>b.disabled=!D);
 const ch=STAGE.querySelector('.chap'),on=ch&&ch.querySelector('.on');if(on&&ch.scrollWidth>ch.clientWidth)ch.scrollLeft=on.offsetLeft-(ch.clientWidth-on.offsetWidth)/2}
if(SETS[QP.get('b')])setBiz(QP.get('b'));const h=location.hash.slice(1);go(D&&CH.some(c=>c[0]===h)?h:(D?'scan':'find'));
})();
