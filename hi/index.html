<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi · Local AI Registry</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#fafaf9; --muted:#a8a29e; } }
  html,body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align:center; padding:16px; }
  h1 { font-size:clamp(4rem, 18vw, 10rem); margin:0; letter-spacing:-0.04em; font-weight:700; }
  p { color:var(--muted); margin-top:.5rem; font-size:1rem; }
</style>
</head>
<body>
  <main>
    <h1>Hi</h1>
    <p>audit.localairegistry.com</p>
  </main>
</body>
</html>
